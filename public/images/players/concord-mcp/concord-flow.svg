<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Concord claim, prompt, and handoff</title>
  <desc id="desc">An agent claims a file before editing. A prompt to an unreachable agent fails immediately. A handoff waits for accept.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">CONCORD MCP</text>
  <text class="serif" x="64" y="114" font-size="36">Claim first. Hand off only after accept.</text>
  <text class="body" x="64" y="156" font-size="20">concord check exits 1 when an active task already claims the file.</text>
  <g>
    <rect class="card" x="64" y="200" width="620" height="280" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">1</text>
    <text class="node" x="88" y="282">start_work</text>
    <text class="body small" x="88" y="322">Registers presence and claims one task.</text>
    <text class="body small" x="88" y="350">Reports a scope overlap before editing.</text>
    <text class="body small" x="88" y="378">inspect_work shows heartbeat, last</text>
    <text class="body small" x="88" y="406">activity, and the status the agent set.</text>
  </g>
  <g>
    <rect class="card teal" x="716" y="200" width="620" height="280" rx="22"/>
    <text class="label" x="740" y="240" font-size="14">2</text>
    <text class="node" x="740" y="282">update_work prompt</text>
    <text class="body small" x="740" y="322">Names the other agent and an</text>
    <text class="body small" x="740" y="350">idempotency key. Delivery fails at once</text>
    <text class="body small" x="740" y="378">when that agent has no reachable</text>
    <text class="body small" x="740" y="406">endpoint. Concord does not reroute it.</text>
  </g>
  <g>
    <rect class="card amber" x="64" y="510" width="620" height="310" rx="22"/>
    <text class="label" x="88" y="550" font-size="14">3</text>
    <text class="node" x="88" y="592">transfer_work</text>
    <text class="body small" x="88" y="632">Assign, accept, decline, or offer a handoff.</text>
    <text class="body small" x="88" y="660">The sender keeps the task until accept.</text>
    <text class="body small" x="88" y="688">finish_work can mark it review-ready.</text>
    <text class="body small" x="88" y="716">Every ownership change stays in the audit.</text>
  </g>
  <g>
    <rect class="card" x="716" y="510" width="620" height="310" rx="22"/>
    <text class="label" x="740" y="550" font-size="14">CLI</text>
    <text class="node" x="740" y="592">Same workspace</text>
    <text class="body small" x="740" y="632">concord status, who, tasks, dashboard.</text>
    <text class="body small" x="740" y="660">The dashboard is a read-only local TUI.</text>
    <text class="body small" x="740" y="688">concord check is the overlap test for</text>
    <text class="body small" x="740" y="716">a hook or for CI.</text>
  </g>
</svg>
