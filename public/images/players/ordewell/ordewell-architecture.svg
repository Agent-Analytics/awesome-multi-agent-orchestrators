<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Ordewell planner, plan, and worktree tasks</title>
  <desc id="desc">A diagram of Ordewell: a read-only planner drafts tasks, independent tasks run in worktrees, and merge stays off until you turn it on.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .title { font-size: 40px; }
    .node { font-size: 24px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">ORDEWELL</text>
  <text class="serif title" x="64" y="112">A goal becomes an editable plan</text>
  <text class="body" x="64" y="150" font-size="20">The planner reads the repository. Tasks are what change files. README version described here is 0.13.1.</text>
    <rect class="card" x="64" y="190" width="300" height="140" rx="22"/>
    <text class="label" x="88" y="228" font-size="14">1</text>
    <text class="node" x="88" y="264">A goal</text>
    <text class="body small" x="88" y="298">TUI, VS Code, CLI, or local API</text>
  <path d="M364 260 H420" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow)"/>
    <rect class="card teal" x="432" y="190" width="400" height="140" rx="22"/>
    <text class="label" x="456" y="228" font-size="14">2</text>
    <text class="node" x="456" y="264">Planner, read only</text>
    <text class="body small" x="456" y="298">Asks questions. Writes no code.</text>
  <path d="M832 260 H888" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow)"/>
    <rect class="card" x="900" y="190" width="436" height="140" rx="22"/>
    <text class="label" x="924" y="228" font-size="14">3</text>
    <text class="node" x="924" y="264">You edit the plan</text>
    <text class="body small" x="924" y="298">Runner, model, effort, mode.</text>
    <rect class="card teal" x="64" y="390" width="640" height="170" rx="22"/>
    <text class="label" x="88" y="428" font-size="14">RUN</text>
    <text class="node" x="88" y="464">Independent tasks together</text>
    <text class="body small" x="88" y="498">git 2.38 or newer: a worktree each.</text>
    <text class="body small" x="88" y="524">Older git: they share the folder.</text>
  <path d="M704 475 H760" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow)"/>
    <rect class="card amber" x="772" y="390" width="564" height="170" rx="22"/>
    <text class="label" x="796" y="428" font-size="14">MERGE</text>
    <text class="node" x="796" y="464">Off unless you turn it on</text>
    <text class="body small" x="796" y="498">Read the diff, then merge.</text>
    <text class="body small" x="796" y="524">Autorun is off by default.</text>
    <rect class="card" x="64" y="620" width="640" height="210" rx="22"/>
    <text class="label" x="88" y="658" font-size="14">RUNNERS</text>
    <text class="node" x="88" y="694">Eight, mixed in one plan</text>
    <text class="body small" x="88" y="728">Claude Code, Codex, OpenCode,</text>
    <text class="body small" x="88" y="754">Copilot CLI, Qwen, Cline, Gemini, Cursor.</text>
    <rect class="card amber" x="736" y="620" width="600" height="210" rx="22"/>
    <text class="label" x="760" y="658" font-size="14">VERSION CHECK</text>
    <text class="node" x="760" y="694">Once a day</text>
    <text class="body small" x="760" y="728">Sends version and a random install ID.</text>
    <text class="body small" x="760" y="754">ORDEWELL_NO_VERSION_CHECK=1 stops it.</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6e67"/>
    </marker>
  </defs>
</svg>
