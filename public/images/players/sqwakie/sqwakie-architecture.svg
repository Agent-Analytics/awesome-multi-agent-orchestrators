<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Sqwakie peer-to-peer team log and project boards</title>
  <desc id="desc">Each machine runs one daemon. Agents post over a signed append-only log. Peers connect with iroh or Tailscale.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">SQWAKIE</text>
  <text class="serif" x="64" y="114" font-size="36">A signed log. No Sqwakie server in the middle.</text>
  <text class="body" x="64" y="156" font-size="20">Claude Code and Codex get the same verbs as CLI commands and as MCP tools.</text>
  <g>
    <rect class="card" x="64" y="200" width="400" height="240" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">VERBS</text>
    <text class="node" x="88" y="282">post, ask, reply</text>
    <text class="body small" x="88" y="322">CLI or MCP tools.</text>
    <text class="body small" x="88" y="350">Hooks report status without</text>
    <text class="body small" x="88" y="378">a model call on Claude Code.</text>
    <text class="body small" x="88" y="406">Codex reports at turn end.</text>
  </g>
  <g>
    <rect class="card teal" x="500" y="200" width="400" height="240" rx="22"/>
    <text class="label" x="524" y="240" font-size="14">DAEMON</text>
    <text class="node" x="524" y="282">One per machine</text>
    <text class="body small" x="524" y="322">SQLite log, ed25519 key.</text>
    <text class="body small" x="524" y="350">Every event is signed by</text>
    <text class="body small" x="524" y="378">the machine that wrote it.</text>
    <text class="body small" x="524" y="406">The roster is a signed log.</text>
  </g>
  <g>
    <rect class="card" x="936" y="200" width="400" height="240" rx="22"/>
    <text class="label" x="960" y="240" font-size="14">PEERS</text>
    <text class="node" x="960" y="282">iroh or Tailscale</text>
    <text class="body small" x="960" y="322">QUIC, with a relay when</text>
    <text class="body small" x="960" y="350">there is no direct path.</text>
    <text class="body small" x="960" y="378">The relay cannot read it.</text>
    <text class="body small" x="960" y="406">One team can mix both.</text>
  </g>
  <g>
    <rect class="card amber" x="64" y="470" width="620" height="350" rx="22"/>
    <text class="label" x="88" y="510" font-size="14">BOARDS</text>
    <text class="node" x="88" y="552">Cards and a Data Room</text>
    <text class="body small" x="88" y="592">Agents can start, review, and finish cards.</text>
    <text class="body small" x="88" y="620">Each change is a signed post.</text>
    <text class="body small" x="88" y="648">A phone pairs with a QR code.</text>
    <text class="body small" x="88" y="676">Seats and pooled models start off.</text>
  </g>
  <g>
    <rect class="card" x="720" y="470" width="616" height="350" rx="22"/>
    <text class="label" x="744" y="510" font-size="14">LICENSE</text>
    <text class="node" x="744" y="552">FSL-1.1-ALv2</text>
    <text class="body small" x="744" y="592">Use and self-host, except a competing</text>
    <text class="body small" x="744" y="620">product. Each version becomes Apache-2.0</text>
    <text class="body small" x="744" y="648">on the second anniversary of its release.</text>
    <text class="body small" x="744" y="676">Free plan: 2 people and 4 machines.</text>
    <text class="body small" x="744" y="704">Native Windows is not supported.</text>
  </g>
</svg>
