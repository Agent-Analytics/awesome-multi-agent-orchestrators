<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Four roles, one workspace folder</title>
  <desc id="desc">Agon experiment roles write files in one workspace. The auditor and reviewer are separate from the coder.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">AGON</text>
  <text class="serif" x="64" y="114" font-size="40">Four roles, one workspace folder</text>
  <text class="body" x="64" y="156" font-size="20">experiment-tick coordinates scientist, coder, auditor, and reviewer.</text>
  <g>
    <rect class="card" x="64" y="200" width="300" height="250" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">1</text>
    <text class="node" x="88" y="282">Scientist</text>
    <text class="body small" x="88" y="322">Plans the experiment</text>
    <text class="body small" x="88" y="350">in the workspace.</text>
    <text class="body small" x="88" y="378">The command is</text>
    <text class="body small" x="88" y="406">/experiment-tick.</text>
  </g>
  <g>
    <rect class="card teal" x="396" y="200" width="300" height="250" rx="22"/>
    <text class="label" x="420" y="240" font-size="14">2</text>
    <text class="node" x="420" y="282">Coder</text>
    <text class="body small" x="420" y="322">Implements the</text>
    <text class="body small" x="420" y="350">experiment in the</text>
    <text class="body small" x="420" y="378">workspace. The role</text>
    <text class="body small" x="420" y="406">file is experiment-coder.</text>
  </g>
  <g>
    <rect class="card amber" x="728" y="200" width="300" height="250" rx="22"/>
    <text class="label" x="752" y="240" font-size="14">3</text>
    <text class="node" x="752" y="282">Auditor</text>
    <text class="body small" x="752" y="322">Checks the run. The</text>
    <text class="body small" x="752" y="350">plugin ships</text>
    <text class="body small" x="752" y="378">experiment-auditor</text>
    <text class="body small" x="752" y="406">and experiment-screener.</text>
  </g>
  <g>
    <rect class="card" x="1060" y="200" width="276" height="250" rx="22"/>
    <text class="label" x="1084" y="240" font-size="14">4</text>
    <text class="node" x="1084" y="282">Reviewer</text>
    <text class="body small" x="1084" y="322">experiment-reviewer</text>
    <text class="body small" x="1084" y="350">reads the result</text>
    <text class="body small" x="1084" y="378">before the loop</text>
    <text class="body small" x="1084" y="406">moves on.</text>
  </g>
  <g>
    <rect class="card" x="64" y="520" width="1272" height="340" rx="22"/>
    <text class="label" x="88" y="560" font-size="14">LIMIT</text>
    <text class="node" x="88" y="602">Where the files live</text>
    <text class="body small" x="88" y="642">Agon the plugin and agon-artifacts the data directory sit side by side.</text>
    <text class="body small" x="88" y="674">topics/, ideas/, and workspace/ are the expected data layout. Optional model routing is .settings.toml.</text>
    <text class="body small" x="88" y="706">The repository license is MIT. The paper is arXiv 2606.24177.</text>
  </g>
</svg>
