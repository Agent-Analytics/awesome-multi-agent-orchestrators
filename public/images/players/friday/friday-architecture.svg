<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Agents share a board, each in its own worktree</title>
  <desc id="desc">Friday drives the coding CLIs already signed in on the computer. It listens on 127.0.0.1.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">FRIDAY</text>
  <text class="serif" x="64" y="114" font-size="40">Agents share a board, each in its own worktree</text>
  <text class="body" x="64" y="156" font-size="20">Friday drives the coding CLIs already signed in on the computer. It listens on 127.0.0.1.</text>
  <g>
    <rect class="card" x="64" y="200" width="410" height="210" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">TALK</text>
    <text class="node" x="88" y="282">Agents message</text>
    <text class="body small" x="88" y="322">A rename, a question, an answer.</text>
    <text class="body small" x="88" y="350">You see every message in the session.</text>
  </g>
  <g>
    <rect class="card teal" x="506" y="200" width="410" height="210" rx="22"/>
    <text class="label" x="530" y="240" font-size="14">SPLIT</text>
    <text class="node" x="530" y="282">Own worktree</text>
    <text class="body small" x="530" y="322">One agent posts the task board.</text>
    <text class="body small" x="530" y="350">Each part runs in its own copy</text>
    <text class="body small" x="530" y="378">of the repo.</text>
  </g>
  <g>
    <rect class="card" x="948" y="200" width="388" height="210" rx="22"/>
    <text class="label" x="972" y="240" font-size="14">CHECK</text>
    <text class="node" x="972" y="282">Another agent</text>
    <text class="body small" x="972" y="322">A finished task is checked by</text>
    <text class="body small" x="972" y="350">another agent, then you read</text>
    <text class="body small" x="972" y="378">the diff and note any line.</text>
  </g>
  <g>
    <rect class="card amber" x="64" y="450" width="1272" height="350" rx="22"/>
    <text class="label" x="88" y="490" font-size="14">LOCAL</text>
    <text class="node" x="88" y="532">What leaves the machine</text>
    <text class="body small" x="88" y="572">The app asks before it sends anonymous usage counts to PostHog.</text>
    <text class="body small" x="88" y="600">It sends nothing before you answer. Prompts, code, paths, and accounts stay off that send.</text>
    <text class="body small" x="88" y="628">FRIDAY_NO_TELEMETRY=1 or DO_NOT_TRACK=1 turns the counts off.</text>
    <text class="body small" x="88" y="656">An MCP client on the computer can start a Friday session.</text>
  </g>
</svg>
