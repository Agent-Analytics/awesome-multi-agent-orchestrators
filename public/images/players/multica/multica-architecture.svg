<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Multica issue assignment, daemon, and MCP</title>
  <desc id="desc">A diagram of Multica: an assigned issue reaches a daemon on your machine, which runs a coding-agent CLI, with MCP servers assigned per agent.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .title { font-size: 40px; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">MULTICA</text>
  <text class="serif title" x="64" y="112">The issue is the record</text>
  <text class="body" x="64" y="150" font-size="20">The daemon runs next to the code. Multica does not ship a model.</text>
  <g>
    <rect class="card" x="64" y="188" width="400" height="198" rx="22"/>
    <text class="label" x="88" y="224" font-size="14">ISSUE</text><text class="node" x="88" y="258">Assign an agent</text><text class="body small" x="88" y="292">It comments as it works.</text><text class="body small" x="88" y="318">The result waits in review.</text><text class="body small" x="88" y="344">A person decides what ships.</text>
  </g>
  <g>
    <rect class="card teal" x="492" y="188" width="440" height="198" rx="22"/>
    <text class="label" x="516" y="224" font-size="14">DAEMON</text><text class="node" x="516" y="258">On your machine</text><text class="body small" x="516" y="292">WebSocket to the Go API.</text><text class="body small" x="516" y="318">Spawns the agent CLI.</text><text class="body small" x="516" y="344">PostgreSQL 17 stores the board.</text>
  </g>
  <g>
    <rect class="card" x="960" y="188" width="404" height="198" rx="22"/>
    <text class="label" x="984" y="224" font-size="14">RUNTIME</text><text class="node" x="984" y="258">A CLI you installed</text><text class="body small" x="984" y="292">The README lists 31.</text><text class="body small" x="984" y="318">Claude Code, Codex, Cursor,</text><text class="body small" x="984" y="344">Copilot, and others.</text>
  </g>
  <path d="M468 287 H486" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-multica)"/>
  <path d="M936 287 H954" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-multica)"/>
  <g>
    <rect class="card amber" x="64" y="414" width="620" height="198" rx="22"/>
    <text class="label" x="88" y="450" font-size="14">MCP</text><text class="node" x="88" y="484">STDIO or HTTP</text><text class="body small" x="88" y="518">Add a command or a URL.</text><text class="body small" x="88" y="544">Or assign one from</text><text class="body small" x="88" y="570">the workspace library.</text>
  </g>
  <g>
    <rect class="card" x="712" y="414" width="624" height="198" rx="22"/>
    <text class="label" x="736" y="450" font-size="14">SKILLS</text><text class="node" x="736" y="484">Reuse a playbook</text><text class="body small" x="736" y="518">Attach skills to an agent.</text><text class="body small" x="736" y="544">Squads group people and agents.</text><text class="body small" x="736" y="570">A leader can route work.</text>
  </g>
  <path d="M688 513 H706" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-multica)"/>
  <g>
    <rect class="card" x="64" y="640" width="1272" height="172" rx="22"/>
    <text class="label" x="88" y="676" font-size="14">LICENSE</text><text class="node" x="88" y="710">Apache 2.0 plus conditions</text><text class="body small" x="88" y="744">A public hosted instance needs a commercial license, even if it is free.</text><text class="body small" x="88" y="770">Internal use in one organization does not. Producer: Index Labs (Hong Kong) Limited.</text>
  </g>
  <defs>
    <marker id="arrow-multica" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6e67"/>
    </marker>
  </defs>
</svg>
