<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">ccswarm default flow and Herdr tabs</title>
  <desc id="desc">The default flow is plan, Sangha quorum, implement, review, and fix. Local provider stages run in Herdr tabs.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">CCSWARM</text>
  <text class="serif" x="64" y="114" font-size="36">Plan, quorum, implement, review, fix</text>
  <text class="body" x="64" y="156" font-size="20">MIT license. Rust. Local runs need Herdr 0.9.5 or later.</text>
  <g>
    <rect class="card" x="64" y="200" width="620" height="300" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">PLAN</text>
    <text class="node" x="88" y="282">First stage</text>
    <text class="body small" x="88" y="322">The planner writes the approach.</text>
    <text class="body small" x="88" y="350">A Sangha stage can sit before code.</text>
    <text class="body small" x="88" y="378">Members end with APPROVE or REVISE.</text>
  </g>
  <g>
    <rect class="card teal" x="716" y="200" width="620" height="300" rx="22"/>
    <text class="label" x="740" y="240" font-size="14">PARALLEL</text>
    <text class="node" x="740" y="282">team flow</text>
    <text class="body small" x="740" y="322">The team flow runs frontend and</text>
    <text class="body small" x="740" y="350">backend workers in parallel.</text>
    <text class="body small" x="740" y="378">A supervisor reviews after both.</text>
  </g>
  <g>
    <rect class="card" x="64" y="530" width="620" height="300" rx="22"/>
    <text class="label" x="88" y="570" font-size="14">HERDR</text>
    <text class="node" x="88" y="612">One tab per stage</text>
    <text class="body small" x="88" y="652">Each local stage opens a background tab</text>
    <text class="body small" x="88" y="680">and closes when it finishes.</text>
    <text class="body small" x="88" y="708">Outside Herdr, local providers stop.</text>
  </g>
  <g>
    <rect class="card amber" x="716" y="530" width="620" height="300" rx="22"/>
    <text class="label" x="740" y="570" font-size="14">REMOTE</text>
    <text class="node" x="740" y="612">A2A still runs</text>
    <text class="body small" x="740" y="652">CCSWARM_A2A_ENDPOINT sends a turn</text>
    <text class="body small" x="740" y="680">to a remote server.</text>
    <text class="body small" x="740" y="708">Commands that skip providers still work.</text>
  </g>
</svg>
