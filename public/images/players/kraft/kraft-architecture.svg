<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">A chain file, with a person at each gate</title>
  <desc id="desc">One local process on 127.0.0.1. Each work item has its own git worktree. Apache-2.0.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">KRAFT</text>
  <text class="serif" x="64" y="114" font-size="40">A chain file, with a person at each gate</text>
  <text class="body" x="64" y="156" font-size="20">One local process on 127.0.0.1. Each work item has its own git worktree. Apache-2.0.</text>
  <g>
    <rect class="card" x="64" y="200" width="300" height="240" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">1</text>
    <text class="node" x="88" y="282">File it</text>
    <text class="body small" x="88" y="322">The item waits until</text>
    <text class="body small" x="88" y="350">you start it, from the</text>
    <text class="body small" x="88" y="378">web UI, a phone, or the CLI.</text>
  </g>
  <g>
    <rect class="card amber" x="396" y="200" width="300" height="240" rx="22"/>
    <text class="label" x="420" y="240" font-size="14">2</text>
    <text class="node" x="420" y="282">Spec and plan</text>
    <text class="body small" x="420" y="322">The agent drafts each.</text>
    <text class="body small" x="420" y="350">A gate stops until you</text>
    <text class="body small" x="420" y="378">approve or request changes.</text>
  </g>
  <g>
    <rect class="card teal" x="728" y="200" width="300" height="240" rx="22"/>
    <text class="label" x="752" y="240" font-size="14">3</text>
    <text class="node" x="752" y="282">Own worktree</text>
    <text class="body small" x="752" y="322">The build runs on its own</text>
    <text class="body small" x="752" y="350">branch. Tests and CI are</text>
    <text class="body small" x="752" y="378">steps of their own.</text>
  </g>
  <g>
    <rect class="card" x="1060" y="200" width="276" height="240" rx="22"/>
    <text class="label" x="1084" y="240" font-size="14">4</text>
    <text class="node" x="1084" y="282">Review</text>
    <text class="body small" x="1084" y="322">A separate reviewer decides</text>
    <text class="body small" x="1084" y="350">the fix. Then a draft</text>
    <text class="body small" x="1084" y="378">merge request.</text>
  </g>
  <g>
    <rect class="card" x="64" y="480" width="1272" height="320" rx="22"/>
    <text class="label" x="88" y="520" font-size="14">LIMIT</text>
    <text class="node" x="88" y="562">What the agent cannot skip</text>
    <text class="body small" x="88" y="602">Attempts, time, and dollars are capped. A capped item stops and hands you the trace.</text>
    <text class="body small" x="88" y="630">An agent's own call to decide its gate is refused.</text>
    <text class="body small" x="88" y="658">Only a sandbox with a network policy keeps an agent from deciding its own gates. None is set by default.</text>
  </g>
</svg>
