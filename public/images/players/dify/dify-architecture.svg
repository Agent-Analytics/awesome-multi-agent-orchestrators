<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Dify workflow, agent sandbox, and HTTP MCP</title>
  <desc id="desc">A diagram of Dify: a workflow can call an agent in its own sandbox, and MCP tools are imported from an HTTP server.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .title { font-size: 40px; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">DIFY</text>
  <text class="serif title" x="64" y="112">Docker Compose, then /install</text>
  <text class="body" x="64" y="150" font-size="20">The README asks for 2 CPU cores, 4 GiB of RAM, and Compose v2.35.0 or later.</text>
  <g>
    <rect class="card" x="64" y="188" width="420" height="198" rx="22"/>
    <text class="label" x="88" y="224" font-size="14">CANVAS</text><text class="node" x="88" y="258">Workflow or chatflow</text><text class="body small" x="88" y="292">LLM, retrieval, code,</text><text class="body small" x="88" y="318">HTTP, and if/else</text><text class="body small" x="88" y="344">are nodes on the canvas.</text>
  </g>
  <g>
    <rect class="card teal" x="512" y="188" width="440" height="198" rx="22"/>
    <text class="label" x="536" y="224" font-size="14">AGENT</text><text class="node" x="536" y="258">Own sandbox</text><text class="body small" x="536" y="292">Commands and files</text><text class="body small" x="536" y="318">stay in that run.</text><text class="body small" x="536" y="344">Nothing carries into the next.</text>
  </g>
  <g>
    <rect class="card" x="980" y="188" width="384" height="198" rx="22"/>
    <text class="label" x="1004" y="224" font-size="14">MCP</text><text class="node" x="1004" y="258">HTTP servers</text><text class="body small" x="1004" y="292">Paste a server URL.</text><text class="body small" x="1004" y="318">Dify imports its tools.</text><text class="body small" x="1004" y="344">An app can be a server too.</text>
  </g>
  <path d="M488 287 H506" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-dify)"/>
  <path d="M956 287 H974" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-dify)"/>
  <g>
    <rect class="card" x="64" y="414" width="620" height="198" rx="22"/>
    <text class="label" x="88" y="450" font-size="14">STACK</text><text class="node" x="88" y="484">Compose services</text><text class="body small" x="88" y="518">api, worker, web,</text><text class="body small" x="88" y="544">postgres, redis, sandbox,</text><text class="body small" x="88" y="570">plugin daemon, agent backend.</text>
  </g>
  <g>
    <rect class="card amber" x="712" y="414" width="624" height="198" rx="22"/>
    <text class="label" x="736" y="450" font-size="14">LICENSE</text><text class="node" x="736" y="484">Extra conditions</text><text class="body small" x="736" y="518">Multi-tenant hosting needs</text><text class="body small" x="736" y="544">written permission. One tenant</text><text class="body small" x="736" y="570">is one workspace.</text>
  </g>
  <path d="M688 513 H706" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-dify)"/>
  <g>
    <rect class="card" x="64" y="640" width="1272" height="172" rx="22"/>
    <text class="label" x="88" y="676" font-size="14">SETUP</text><text class="node" x="88" y="710">One generated token</text><text class="body small" x="88" y="744">Set DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN from openssl rand -hex 32.</text><text class="body small" x="88" y="770">init_permissions is expected to exit 0. Keep the default COMPOSE_PROFILES.</text>
  </g>
  <defs>
    <marker id="arrow-dify" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6e67"/>
    </marker>
  </defs>
</svg>
