<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Scion hub, container agent, and workspace</title>
  <desc id="desc">Every agent runs through a hub. The workstation server is that hub on your machine. Agents can use a worktree, a clone, or a shared directory.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">SCION</text>
  <text class="serif" x="64" y="114" font-size="36">A hub starts each agent process</text>
  <text class="body" x="64" y="156" font-size="20">Apache-2.0. Pre-1.0. Not an officially supported Google product.</text>
  <g>
    <rect class="card" x="64" y="200" width="620" height="300" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">INSTALL</text>
    <text class="node" x="88" y="282">CLI and local hub</text>
    <text class="body small" x="88" y="322">brew install from the community tap,</text>
    <text class="body small" x="88" y="350">or make all from a clone.</text>
    <text class="body small" x="88" y="378">scion server start opens onboarding.</text>
  </g>
  <g>
    <rect class="card teal" x="716" y="200" width="620" height="300" rx="22"/>
    <text class="label" x="740" y="240" font-size="14">AGENT</text>
    <text class="node" x="740" y="282">Own container</text>
    <text class="body small" x="740" y="322">scion start names the agent and task.</text>
    <text class="body small" x="740" y="350">Harness and credentials are per agent.</text>
    <text class="body small" x="740" y="378">scion message sends it a message.</text>
  </g>
  <g>
    <rect class="card" x="64" y="530" width="620" height="300" rx="22"/>
    <text class="label" x="88" y="570" font-size="14">WORKSPACE</text>
    <text class="node" x="88" y="612">How files are shared</text>
    <text class="body small" x="88" y="652">Shared directories, git worktrees,</text>
    <text class="body small" x="88" y="680">or separate clones.</text>
    <text class="body small" x="88" y="708">The runtime can be Docker, Podman,</text>
    <text class="body small" x="88" y="736">Apple Container, Kubernetes, or Cloud Run.</text>
  </g>
  <g>
    <rect class="card amber" x="716" y="530" width="620" height="300" rx="22"/>
    <text class="label" x="740" y="570" font-size="14">PEOPLE</text>
    <text class="node" x="740" y="612">Watch or attach</text>
    <text class="body small" x="740" y="652">The web UI follows the work.</text>
    <text class="body small" x="740" y="680">Chat bridges include Slack and Discord.</text>
    <text class="body small" x="740" y="708">scion attach joins a tmux session.</text>
  </g>
</svg>
