<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">SwarmClaw delegation, task stages, and MCP</title>
  <desc id="desc">A diagram of SwarmClaw: a coordinator delegates, task stages can block completion, and each agent can use MCP servers.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .title { font-size: 40px; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">SWARMCLAW</text>
  <text class="serif title" x="64" y="112">Control plane on port 3456</text>
  <text class="body" x="64" y="150" font-size="20">npm i -g @swarmclawai/swarmclaw. The license is MIT.</text>
  <g>
    <rect class="card" x="64" y="188" width="420" height="198" rx="22"/>
    <text class="label" x="88" y="224" font-size="14">ORG</text><text class="node" x="88" y="258">Coordinator</text><text class="body small" x="88" y="292">Delegates to workers.</text><text class="body small" x="88" y="318">Each has a provider,</text><text class="body small" x="88" y="344">tools, and a soul.</text>
  </g>
  <g>
    <rect class="card teal" x="512" y="188" width="420" height="198" rx="22"/>
    <text class="label" x="536" y="224" font-size="14">BOARD</text><text class="node" x="536" y="258">Task stages</text><text class="body small" x="536" y="292">Review, approval,</text><text class="body small" x="536" y="318">and verification.</text><text class="body small" x="536" y="344">A waiting stage blocks done.</text>
  </g>
  <g>
    <rect class="card" x="960" y="188" width="404" height="198" rx="22"/>
    <text class="label" x="984" y="224" font-size="14">MCP</text><text class="node" x="984" y="258">Per agent</text><text class="body small" x="984" y="292">stdio, SSE, or</text><text class="body small" x="984" y="318">streamable HTTP.</text><text class="body small" x="984" y="344">Assign it in the panel.</text>
  </g>
  <path d="M488 287 H506" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-swarm)"/>
  <path d="M936 287 H954" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-swarm)"/>
  <g>
    <rect class="card" x="64" y="414" width="620" height="198" rx="22"/>
    <text class="label" x="88" y="450" font-size="14">DELEGATION</text><text class="node" x="88" y="484">CLIs or a subagent</text><text class="body small" x="88" y="518">Claude Code, Codex, OpenCode,</text><text class="body small" x="88" y="544">Gemini, Cursor, Qwen Code,</text><text class="body small" x="88" y="570">or a SwarmClaw subagent.</text>
  </g>
  <g>
    <rect class="card amber" x="712" y="414" width="624" height="198" rx="22"/>
    <text class="label" x="736" y="450" font-size="14">SCHEDULES</text><text class="node" x="736" y="484">Heartbeats and cron</text><text class="body small" x="736" y="518">Delivery status is stored.</text><text class="body small" x="736" y="544">A missing credential fails</text><text class="body small" x="736" y="570">before the model call.</text>
  </g>
  <path d="M688 513 H706" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-swarm)"/>
  <g>
    <rect class="card" x="64" y="640" width="1272" height="172" rx="22"/>
    <text class="label" x="88" y="676" font-size="14">ALSO</text><text class="node" x="88" y="710">Connectors and skills</text><text class="body small" x="88" y="744">Discord, Slack, Telegram, WhatsApp, Teams, Matrix, and email.</text><text class="body small" x="88" y="770">OpenClaw SKILL.md files can be imported. Node.js 22.6 or newer.</text>
  </g>
  <defs>
    <marker id="arrow-swarm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6e67"/>
    </marker>
  </defs>
</svg>
