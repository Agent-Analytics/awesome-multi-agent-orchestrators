<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw local Gateway, channels, and MCP</title>
  <desc id="desc">Chats and native apps talk to one local Gateway. MCP servers still pass the tool policy.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .title { font-size: 40px; }
    .node { font-size: 24px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 17px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">OPENCLAW</text>
  <text class="serif title" x="64" y="112">A Gateway that stays running</text>
  <text class="body" x="64" y="152" font-size="20">Chats and native apps talk to one local Gateway. MCP servers still pass the tool policy.</text>
  <g>
    <rect class="card" x="64" y="190" width="405" height="250" rx="22"/>
    <text class="label" x="88" y="230" font-size="14">1</text>
    <text class="node" x="88" y="268">You</text>
    <text class="body small" x="88" y="308">A chat app or a native</text>
    <text class="body small" x="88" y="336">app on this computer.</text>
  </g>
  <path d="M473 315 H491" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-openclaw-local-gateway-channels-and-mcp)"/>
  <g>
    <rect class="card teal" x="497" y="190" width="405" height="250" rx="22"/>
    <text class="label" x="521" y="230" font-size="14">2</text>
    <text class="node" x="521" y="268">Gateway</text>
    <text class="body small" x="521" y="308">Sessions, tools, events,</text>
    <text class="body small" x="521" y="336">and channel connections.</text>
  </g>
  <path d="M907 315 H925" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-openclaw-local-gateway-channels-and-mcp)"/>
  <g>
    <rect class="card" x="931" y="190" width="405" height="250" rx="22"/>
    <text class="label" x="955" y="230" font-size="14">3</text>
    <text class="node" x="955" y="268">Model</text>
    <text class="body small" x="955" y="308">The provider you set.</text>
    <text class="body small" x="955" y="336">A daily version check</text>
    <text class="body small" x="955" y="364">is the default phone-home.</text>
  </g>
  <g>
    <rect class="card" x="64" y="490" width="405" height="330" rx="22"/>
    <text class="label" x="88" y="530" font-size="14">CHANNELS</text>
    <text class="node" x="88" y="568">Named in the README</text>
    <text class="body small" x="88" y="608">Discord, iMessage, Slack,</text>
    <text class="body small" x="88" y="636">Teams, Telegram, WhatsApp,</text>
    <text class="body small" x="88" y="664">and more than 20 others.</text>
  </g>
  <g>
    <rect class="card teal" x="497" y="490" width="405" height="330" rx="22"/>
    <text class="label" x="521" y="530" font-size="14">MCP</text>
    <text class="node" x="521" y="568">You connect out</text>
    <text class="body small" x="521" y="608">stdio, SSE, or streamable</text>
    <text class="body small" x="521" y="636">HTTP. Tools still pass</text>
    <text class="body small" x="521" y="664">the tool policy.</text>
  </g>
  <g>
    <rect class="card amber" x="931" y="490" width="405" height="330" rx="22"/>
    <text class="label" x="955" y="530" font-size="14">SERVE</text>
    <text class="node" x="955" y="568">The other way</text>
    <text class="body small" x="955" y="608">openclaw mcp serve exposes</text>
    <text class="body small" x="955" y="636">channel conversations to</text>
    <text class="body small" x="955" y="664">another MCP client.</text>
  </g>
  <defs>
    <marker id="arrow-openclaw-local-gateway-channels-and-mcp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6e67"/>
    </marker>
  </defs>
</svg>
