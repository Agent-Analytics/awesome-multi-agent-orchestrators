<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Gas Town workspace, Mayor, rigs, and polecats</title>
  <desc id="desc">A diagram of Gas Town: a town directory, a Mayor session, rigs with polecats in git worktrees, and beads for work state.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .title { font-size: 40px; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">GAS TOWN</text>
  <text class="serif title" x="64" y="112">A directory called ~/gt</text>
  <text class="body" x="64" y="150" font-size="20">gt install creates it. gt up starts Dolt, the daemon, the Deacon, and the Mayor.</text>
  <g>
    <rect class="card" x="64" y="214" width="360" height="146" rx="22"/>
    <text class="label" x="88" y="250" font-size="14">TOWN</text><text class="node" x="88" y="284">~/gt</text><text class="body small" x="88" y="318">Rigs and config live here.</text>
  </g>
  <g>
    <rect class="card teal" x="452" y="188" width="420" height="198" rx="22"/>
    <text class="label" x="476" y="224" font-size="14">MAYOR</text><text class="node" x="476" y="258">Coordinator</text><text class="body small" x="476" y="292">gt mayor attach.</text><text class="body small" x="476" y="318">The README's default</text><text class="body small" x="476" y="344">runtime is Claude Code.</text>
  </g>
  <g>
    <rect class="card" x="900" y="188" width="464" height="198" rx="22"/>
    <text class="label" x="924" y="224" font-size="14">RIG</text><text class="node" x="924" y="258">One repository</text><text class="body small" x="924" y="292">A crew workspace for you.</text><text class="body small" x="924" y="318">Polecats take tasks.</text><text class="body small" x="924" y="344">Hooks are git worktrees.</text>
  </g>
  <path d="M428 287 H446" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-gt-town)"/>
  <path d="M876 287 H894" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-gt-town)"/>
  <g>
    <rect class="card amber" x="64" y="414" width="620" height="198" rx="22"/>
    <text class="label" x="88" y="450" font-size="14">BEADS</text><text class="node" x="88" y="484">Issues in git</text><text class="body small" x="88" y="518">bd is the tracker.</text><text class="body small" x="88" y="544">An id looks like gt-abc12.</text><text class="body small" x="88" y="570">gt sling assigns it.</text>
  </g>
  <g>
    <rect class="card" x="712" y="414" width="624" height="198" rx="22"/>
    <text class="label" x="736" y="450" font-size="14">WATCH</text><text class="node" x="736" y="484">Witness and Deacon</text><text class="body small" x="736" y="518">A Witness watches one rig.</text><text class="body small" x="736" y="544">The Deacon patrols all rigs.</text><text class="body small" x="736" y="570">Dogs run maintenance.</text>
  </g>
  <path d="M688 513 H706" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-gt-town)"/>
  <g>
    <rect class="card" x="64" y="640" width="1272" height="172" rx="22"/>
    <text class="label" x="88" y="676" font-size="14">SESSIONS</text><text class="node" x="88" y="710">tmux 3.0 or newer</text><text class="body small" x="88" y="744">Needed for Mayor, Witness, Refinery, and polecat sessions.</text><text class="body small" x="88" y="770">Presets include claude, codex, gemini, copilot, cursor, opencode, and others.</text>
  </g>
  <defs>
    <marker id="arrow-gt-town" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6e67"/>
    </marker>
  </defs>
</svg>
