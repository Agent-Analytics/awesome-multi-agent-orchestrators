<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">T3 Code threads, child tasks, and outside MCP agents</title>
  <desc id="desc">T3 Code drives coding agents already signed in on the machine. A delegated task is a child thread that does not receive the parent history.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">T3 CODE</text>
  <text class="serif" x="64" y="114" font-size="36">One server. A child thread per handoff.</text>
  <text class="body" x="64" y="156" font-size="20">Desktop, web, and the phone apps show the same threads. MIT license.</text>
  <g>
    <rect class="card" x="64" y="200" width="400" height="240" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">CLIENTS</text>
    <text class="node" x="88" y="282">Same threads</text>
    <text class="body small" x="88" y="322">Desktop, web, iOS, Android.</text>
    <text class="body small" x="88" y="350">Connect over the LAN,</text>
    <text class="body small" x="88" y="378">Tailscale, or T3 Connect.</text>
    <text class="body small" x="88" y="406">T3 does not resell tokens.</text>
  </g>
  <g>
    <rect class="card teal" x="500" y="200" width="400" height="240" rx="22"/>
    <text class="label" x="524" y="240" font-size="14">INSIDE</text>
    <text class="node" x="524" y="282">delegate_task</text>
    <text class="body small" x="524" y="322">Creates a T3 child thread.</text>
    <text class="body small" x="524" y="350">The child gets the task prompt</text>
    <text class="body small" x="524" y="378">and an optional role.</text>
    <text class="body small" x="524" y="406">Parent history is not copied.</text>
  </g>
  <g>
    <rect class="card" x="936" y="200" width="400" height="240" rx="22"/>
    <text class="label" x="960" y="240" font-size="14">OUTSIDE</text>
    <text class="node" x="960" y="282">/mcp</text>
    <text class="body small" x="960" y="322">Claude Code, Codex, ChatGPT,</text>
    <text class="body small" x="960" y="350">or another OAuth MCP client.</text>
    <text class="body small" x="960" y="378">Read only, Supervised, or</text>
    <text class="body small" x="960" y="406">Full access. 30-day sign-in.</text>
  </g>
  <g>
    <rect class="card amber" x="64" y="470" width="620" height="350" rx="22"/>
    <text class="label" x="88" y="510" font-size="14">PERMISSIONS</text>
    <text class="node" x="88" y="552">Full access is the initial default</text>
    <text class="body small" x="88" y="592">Set another default under Settings, Threads.</text>
    <text class="body small" x="88" y="620">Supervised asks before commands and edits.</text>
    <text class="body small" x="88" y="648">Auto uses the provider's own review where</text>
    <text class="body small" x="88" y="676">that provider has one. A managed policy</text>
    <text class="body small" x="88" y="704">can cap the modes on a machine.</text>
  </g>
  <g>
    <rect class="card" x="720" y="470" width="616" height="350" rx="22"/>
    <text class="label" x="744" y="510" font-size="14">GIT</text>
    <text class="node" x="744" y="552">Worktree and pull request</text>
    <text class="body small" x="744" y="592">A thread can use its own worktree.</text>
    <text class="body small" x="744" y="620">Git actions commit, push, and open</text>
    <text class="body small" x="744" y="648">a pull request. A provider switch is a</text>
    <text class="body small" x="744" y="676">budgeted handoff. It does not copy the</text>
    <text class="body small" x="744" y="704">other provider's tool-call state.</text>
  </g>
</svg>
