<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">STARK AI assistants, specialists, and the publish gate</title>
  <desc id="desc">Vision and Wanda call seven specialists. Only D.U.M.-E. can publish, and social.publish waits for approval of the exact text.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">STARK AI</text>
  <text class="serif" x="64" y="114" font-size="36">Specialists draft. One agent can publish.</text>
  <text class="body" x="64" y="156" font-size="20">The GitHub repository stark-os redirects to Shahrukhalid/stark-ai.</text>
  <g>
    <rect class="card" x="64" y="200" width="400" height="230" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">YOU</text>
    <text class="node" x="88" y="282">Command</text>
    <text class="body small" x="88" y="322">Talk to Vision or Wanda,</text>
    <text class="body small" x="88" y="350">or name a specialist.</text>
    <text class="body small" x="88" y="378">Assist is the default mode.</text>
    <text class="body small" x="88" y="406">E-STOP pauses the queue.</text>
  </g>
  <g>
    <rect class="card teal" x="500" y="200" width="400" height="230" rx="22"/>
    <text class="label" x="524" y="240" font-size="14">DIRECTOR</text>
    <text class="node" x="524" y="282">J.A.R.V.I.S.</text>
    <text class="body small" x="524" y="322">Plans and delegates.</text>
    <text class="body small" x="524" y="350">Can block a post.</text>
    <text class="body small" x="524" y="378">Cannot publish.</text>
    <text class="body small" x="524" y="406">Delegation depth stops at 2.</text>
  </g>
  <g>
    <rect class="card amber" x="936" y="200" width="400" height="230" rx="22"/>
    <text class="label" x="960" y="240" font-size="14">PUBLISH</text>
    <text class="node" x="960" y="282">D.U.M.-E.</text>
    <text class="body small" x="960" y="322">The only agent that can</text>
    <text class="body small" x="960" y="350">publish. The card shows the</text>
    <text class="body small" x="960" y="378">exact text. An edit cancels</text>
    <text class="body small" x="960" y="406">that approval.</text>
  </g>
  <g>
    <rect class="card" x="64" y="460" width="620" height="360" rx="22"/>
    <text class="label" x="88" y="500" font-size="14">CHECK</text>
    <text class="node" x="88" y="542">Before anything goes out</text>
    <text class="body small" x="88" y="582">Length, leaked keys, personal data,</text>
    <text class="body small" x="88" y="610">a missing ad disclosure, giveaway rules.</text>
    <text class="body small" x="88" y="638">ULTRON is read-only and can say revise</text>
    <text class="body small" x="88" y="666">or kill. JOCASTA cites pages it read.</text>
    <text class="body small" x="88" y="694">The MCP server cannot publish.</text>
  </g>
  <g>
    <rect class="card" x="720" y="460" width="616" height="360" rx="22"/>
    <text class="label" x="744" y="500" font-size="14">AUTOPILOT</text>
    <text class="node" x="744" y="542">Three trust levels</text>
    <text class="body small" x="744" y="582">Co-pilot waits for you. Veto can schedule</text>
    <text class="body small" x="744" y="610">a post that passed every check, after a</text>
    <text class="body small" x="744" y="638">cancel window. Full auto follows 10 clean</text>
    <text class="body small" x="744" y="666">real posts from that campaign. Sensitive</text>
    <text class="body small" x="744" y="694">topics still wait.</text>
  </g>
</svg>
