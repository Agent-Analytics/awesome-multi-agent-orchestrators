<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenSwarm waitlist, agents, and one canvas</title>
  <desc id="desc">The homepage script describes a Mac desktop on a waitlist. Each agent gets its own browser, apps, and tools.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .title { font-size: 40px; }
    .node { font-size: 24px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 17px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">OPENSWARM</text>
  <text class="serif title" x="64" y="112">Many agents, one canvas</text>
  <text class="body" x="64" y="152" font-size="20">The homepage script describes a Mac desktop on a waitlist. Each agent gets its own browser, apps, and tools.</text>
  <g>
    <rect class="card amber" x="64" y="190" width="405" height="250" rx="22"/>
    <text class="label" x="88" y="230" font-size="14">1</text>
    <text class="node" x="88" y="268">Waitlist</text>
    <text class="body small" x="88" y="308">The page says join.</text>
    <text class="body small" x="88" y="336">The script also has a</text>
    <text class="body small" x="88" y="364">paused-waitlist state.</text>
  </g>
  <path d="M473 315 H491" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-openswarm-waitlist-agents-and-one-canvas)"/>
  <g>
    <rect class="card teal" x="497" y="190" width="405" height="250" rx="22"/>
    <text class="label" x="521" y="230" font-size="14">2</text>
    <text class="node" x="521" y="268">Agents</text>
    <text class="body small" x="521" y="308">Each one gets a browser,</text>
    <text class="body small" x="521" y="336">apps, and tools.</text>
  </g>
  <path d="M907 315 H925" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-openswarm-waitlist-agents-and-one-canvas)"/>
  <g>
    <rect class="card" x="931" y="190" width="405" height="250" rx="22"/>
    <text class="label" x="955" y="230" font-size="14">3</text>
    <text class="node" x="955" y="268">Canvas</text>
    <text class="body small" x="955" y="308">You watch them together</text>
    <text class="body small" x="955" y="336">and can step in.</text>
  </g>
  <g>
    <rect class="card" x="64" y="490" width="405" height="330" rx="22"/>
    <text class="label" x="88" y="530" font-size="14">APPS</text>
    <text class="node" x="88" y="568">Named in the script</text>
    <text class="body small" x="88" y="608">Daily Brief, CRM Core,</text>
    <text class="body small" x="88" y="636">Lead Finder, Problem</text>
    <text class="body small" x="88" y="664">Validator, Skill Editor.</text>
  </g>
  <g>
    <rect class="card teal" x="497" y="490" width="405" height="330" rx="22"/>
    <text class="label" x="521" y="530" font-size="14">EXAMPLE</text>
    <text class="node" x="521" y="568">Problem Validator</text>
    <text class="body small" x="521" y="608">One agent each for Reddit,</text>
    <text class="body small" x="521" y="636">X, Hacker News, Product</text>
    <text class="body small" x="521" y="664">Hunt, and LinkedIn.</text>
  </g>
  <g>
    <rect class="card amber" x="931" y="490" width="405" height="330" rx="22"/>
    <text class="label" x="955" y="530" font-size="14">PRICE</text>
    <text class="node" x="955" y="568">Free on the page</text>
    <text class="body small" x="955" y="608">The homepage price line</text>
    <text class="body small" x="955" y="636">is free. Current builds</text>
    <text class="body small" x="955" y="664">are proprietary.</text>
  </g>
  <defs>
    <marker id="arrow-openswarm-waitlist-agents-and-one-canvas" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6e67"/>
    </marker>
  </defs>
</svg>
