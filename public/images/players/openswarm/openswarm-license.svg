<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenSwarm repository, signed builds, and license split</title>
  <desc id="desc">The repository no longer holds product source. The license file splits by date.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .title { font-size: 40px; }
    .node { font-size: 24px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 17px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">OPENSWARM</text>
  <text class="serif title" x="64" y="112">Signed builds, proprietary license</text>
  <text class="body" x="64" y="152" font-size="20">The repository no longer holds product source. The license file splits by date.</text>
  <g>
    <rect class="card amber" x="64" y="190" width="405" height="250" rx="22"/>
    <text class="label" x="88" y="230" font-size="14">NOW</text>
    <text class="node" x="88" y="268">This version</text>
    <text class="body small" x="88" y="308">Proprietary. The LICENSE</text>
    <text class="body small" x="88" y="336">file says this version</text>
    <text class="body small" x="88" y="364">and later.</text>
  </g>
  <path d="M473 315 H491" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-openswarm-repository-signed-builds-and-license-split)"/>
  <g>
    <rect class="card teal" x="497" y="190" width="405" height="250" rx="22"/>
    <text class="label" x="521" y="230" font-size="14">BEFORE</text>
    <text class="node" x="521" y="268">8 September 2026</text>
    <text class="body small" x="521" y="308">Those releases stay</text>
    <text class="body small" x="521" y="336">AGPL-3.0. The file does</text>
    <text class="body small" x="521" y="364">not withdraw that.</text>
  </g>
  <path d="M907 315 H925" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-openswarm-repository-signed-builds-and-license-split)"/>
  <g>
    <rect class="card" x="931" y="190" width="405" height="250" rx="22"/>
    <text class="label" x="955" y="230" font-size="14">REPO</text>
    <text class="node" x="955" y="268">Signed builds</text>
    <text class="body small" x="955" y="308">Installed copies check</text>
    <text class="body small" x="955" y="336">this repository. Issues</text>
    <text class="body small" x="955" y="364">still open here.</text>
  </g>
  <g>
    <rect class="card" x="64" y="490" width="405" height="330" rx="22"/>
    <text class="label" x="88" y="530" font-size="14">SKILL</text>
    <text class="node" x="88" y="568">Skill Editor</text>
    <text class="body small" x="88" y="608">Named in the homepage</text>
    <text class="body small" x="88" y="636">script as an app in</text>
    <text class="body small" x="88" y="664">the launcher.</text>
  </g>
  <g>
    <rect class="card amber" x="497" y="490" width="405" height="330" rx="22"/>
    <text class="label" x="521" y="530" font-size="14">DOCS</text>
    <text class="node" x="521" y="568">docs host</text>
    <text class="body small" x="521" y="608">docs.openswarm.com</text>
    <text class="body small" x="521" y="636">returned HTTP 500 on</text>
    <text class="body small" x="521" y="664">13 November 2026.</text>
  </g>
  <g>
    <rect class="card" x="931" y="490" width="405" height="330" rx="22"/>
    <text class="label" x="955" y="530" font-size="14">IMAGE</text>
    <text class="node" x="955" y="568">Social card</text>
    <text class="body small" x="955" y="608">The conversation and</text>
    <text class="body small" x="955" y="636">workflow images on the</text>
    <text class="body small" x="955" y="664">site returned 404.</text>
  </g>
  <defs>
    <marker id="arrow-openswarm-repository-signed-builds-and-license-split" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6e67"/>
    </marker>
  </defs>
</svg>
