<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">LangGraph checkpoints, interrupts, and LangSmith</title>
  <desc id="desc">A checkpointer stores graph state so a run can resume. LangSmith tracing and deployment are separate from the MIT-licensed core.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">LANGGRAPH</text>
  <text class="serif" x="64" y="114" font-size="36">Pause, store the state, resume</text>
  <text class="body" x="64" y="156" font-size="20">Short-term memory is the thread. Longer memory is a separate store.</text>
  <g>
    <rect class="card" x="64" y="200" width="620" height="300" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">CHECKPOINT</text>
    <text class="node" x="88" y="282">Resume after a stop</text>
    <text class="body small" x="88" y="322">The checkpointer saves state.</text>
    <text class="body small" x="88" y="350">A failed or paused run continues</text>
    <text class="body small" x="88" y="378">from that checkpoint.</text>
  </g>
  <g>
    <rect class="card teal" x="716" y="200" width="620" height="300" rx="22"/>
    <text class="label" x="740" y="240" font-size="14">INTERRUPT</text>
    <text class="node" x="740" y="282">A person can edit</text>
    <text class="body small" x="740" y="322">Human-in-the-loop pauses the graph.</text>
    <text class="body small" x="740" y="350">You can inspect or change state,</text>
    <text class="body small" x="740" y="378">then continue the same thread.</text>
  </g>
  <g>
    <rect class="card" x="64" y="530" width="620" height="300" rx="22"/>
    <text class="label" x="88" y="570" font-size="14">STREAM</text>
    <text class="node" x="88" y="612">Events as it runs</text>
    <text class="body small" x="88" y="652">The runtime can stream tokens,</text>
    <text class="body small" x="88" y="680">state updates, and other events.</text>
    <text class="body small" x="88" y="708">Streaming is optional per call.</text>
  </g>
  <g>
    <rect class="card amber" x="716" y="530" width="620" height="300" rx="22"/>
    <text class="label" x="740" y="570" font-size="14">LANGSMITH</text>
    <text class="node" x="740" y="612">Separate product</text>
    <text class="body small" x="740" y="652">Tracing, evals, and deployment sit</text>
    <text class="body small" x="740" y="680">in LangSmith, not in the MIT core.</text>
    <text class="body small" x="740" y="708">The graph runs without them.</text>
  </g>
</svg>
