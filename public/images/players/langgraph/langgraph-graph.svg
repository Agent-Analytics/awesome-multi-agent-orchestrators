<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">LangGraph StateGraph compile and invoke</title>
  <desc id="desc">A graph is shared state, nodes, and edges. compile makes it runnable. invoke passes the starting state.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">LANGGRAPH</text>
  <text class="serif" x="64" y="114" font-size="36">Shared state, nodes, and edges</text>
  <text class="body" x="64" y="156" font-size="20">Install with pip install -U langgraph. LangGraph does not require LangChain.</text>
  <g>
    <rect class="card" x="64" y="200" width="620" height="300" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">STATE</text>
    <text class="node" x="88" y="282">One shared object</text>
    <text class="body small" x="88" y="322">MessagesState is the docs' minimal</text>
    <text class="body small" x="88" y="350">example. You define the fields.</text>
    <text class="body small" x="88" y="378">Nodes return partial updates.</text>
  </g>
  <g>
    <rect class="card teal" x="716" y="200" width="620" height="300" rx="22"/>
    <text class="label" x="740" y="240" font-size="14">EDGES</text>
    <text class="node" x="740" y="282">START to END</text>
    <text class="body small" x="740" y="322">add_node registers a step.</text>
    <text class="body small" x="740" y="350">add_edge connects START, the node,</text>
    <text class="body small" x="740" y="378">and END. Edges can branch.</text>
  </g>
  <g>
    <rect class="card" x="64" y="530" width="620" height="300" rx="22"/>
    <text class="label" x="88" y="570" font-size="14">MIX</text>
    <text class="node" x="88" y="612">Fixed and model steps</text>
    <text class="body small" x="88" y="652">A node can be ordinary code.</text>
    <text class="body small" x="88" y="680">Another node can call a model.</text>
    <text class="body small" x="88" y="708">The graph does not set the prompt.</text>
  </g>
  <g>
    <rect class="card amber" x="716" y="530" width="620" height="300" rx="22"/>
    <text class="label" x="740" y="570" font-size="14">RUN</text>
    <text class="node" x="740" y="612">compile, then invoke</text>
    <text class="body small" x="740" y="652">compile() returns the runnable graph.</text>
    <text class="body small" x="740" y="680">invoke() starts from the state you pass.</text>
    <text class="body small" x="740" y="708">LangGraph.js is the separate JS library.</text>
  </g>
</svg>
