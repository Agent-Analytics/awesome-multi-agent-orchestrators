<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">A job opening, then a receipt</title>
  <desc id="desc">Agentlas OS runs agents in the tools already on the machine. Completion needs a passing verifier.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">AGENTLAS OS</text>
  <text class="serif" x="64" y="114" font-size="40">A job opening, then a receipt</text>
  <text class="body" x="64" y="156" font-size="20">Hephaestus splits the goal. The host model picks the specialist. A verifier checks the receipt.</text>
  <g>
    <rect class="card" x="64" y="200" width="300" height="250" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">1</text>
    <text class="node" x="88" y="282">Decompose</text>
    <text class="body small" x="88" y="322">A goal becomes a task</text>
    <text class="body small" x="88" y="350">graph. Each task states</text>
    <text class="body small" x="88" y="378">inputs, tools, and</text>
    <text class="body small" x="88" y="406">pass or fail criteria.</text>
  </g>
  <g>
    <rect class="card teal" x="396" y="200" width="300" height="250" rx="22"/>
    <text class="label" x="420" y="240" font-size="14">2</text>
    <text class="node" x="420" y="282">Recruit</text>
    <text class="body small" x="420" y="322">Search local tools,</text>
    <text class="body small" x="420" y="350">your Agent Cloud, and</text>
    <text class="body small" x="420" y="378">the public Hub. The</text>
    <text class="body small" x="420" y="406">model records why.</text>
  </g>
  <g>
    <rect class="card amber" x="728" y="200" width="300" height="250" rx="22"/>
    <text class="label" x="752" y="240" font-size="14">3</text>
    <text class="node" x="752" y="282">Pinned run</text>
    <text class="body small" x="752" y="322">The selection pins the</text>
    <text class="body small" x="752" y="350">release, package hash,</text>
    <text class="body small" x="752" y="378">and content digest</text>
    <text class="body small" x="752" y="406">before anyone starts.</text>
  </g>
  <g>
    <rect class="card" x="1060" y="200" width="276" height="250" rx="22"/>
    <text class="label" x="1084" y="240" font-size="14">4</text>
    <text class="node" x="1084" y="282">Verify</text>
    <text class="body small" x="1084" y="322">A separate verifier</text>
    <text class="body small" x="1084" y="350">must accept the host</text>
    <text class="body small" x="1084" y="378">execution receipt.</text>
    <text class="body small" x="1084" y="406">A bundle is not a receipt.</text>
  </g>
  <g>
    <rect class="card" x="64" y="520" width="1272" height="340" rx="22"/>
    <text class="label" x="88" y="560" font-size="14">LIMIT</text>
    <text class="node" x="88" y="602">Where the work actually runs</text>
    <text class="body small" x="88" y="642">The README says there is no VM. Agents use the terminal, files, and tools already on the machine.</text>
    <text class="body small" x="88" y="674">The default installer uses ~/.agentlas/os-runtime and does not register host plugins unless you ask.</text>
    <text class="body small" x="88" y="706">On the phone, question cards go to the paired desktop. The desktop is where the files are.</text>
  </g>
</svg>
