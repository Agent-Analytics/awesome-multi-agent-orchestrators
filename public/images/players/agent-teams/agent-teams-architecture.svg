<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent Teams provisioning, kanban, messages, and local runtimes</title>
  <desc id="desc">A diagram of Agent Teams: a team is provisioned on a local desktop app, agents create tasks and message each other, and project code stays on the machine.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .title { font-size: 40px; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">AGENT TEAMS</text>
  <text class="serif title" x="64" y="112">A local team on a kanban board</text>
  <text class="body" x="64" y="150" font-size="20">AGPL-3.0 desktop app. The README says it does not upload your project to Agent Teams servers.</text>
  <g>
    <rect class="card" x="64" y="190" width="400" height="204" rx="22"/>
    <text class="label" x="88" y="228" font-size="14">1</text>
    <text class="node" x="88" y="266">Provision a team</text>
    <text class="body small" x="88" y="302">A project, roles, and a</text>
    <text class="body small" x="88" y="330">prompt. Or start with one</text>
    <text class="body small" x="88" y="358">agent in solo mode.</text>
  </g>
  <path d="M464 260 H510" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow)"/>
  <g>
    <rect class="card teal" x="522" y="190" width="400" height="204" rx="22"/>
    <text class="label" x="546" y="228" font-size="14">2</text>
    <text class="node" x="546" y="266">Agents and tasks</text>
    <text class="body small" x="546" y="302">They create tasks, message,</text>
    <text class="body small" x="546" y="330">and review. You can DM</text>
    <text class="body small" x="546" y="358">any agent.</text>
  </g>
  <path d="M922 260 H968" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow)"/>
  <g>
    <rect class="card" x="980" y="190" width="356" height="204" rx="22"/>
    <text class="label" x="1004" y="228" font-size="14">3</text>
    <text class="node" x="1004" y="266">The board</text>
    <text class="body small" x="1004" y="302">The published board shows</text>
    <text class="body small" x="1004" y="330">Todo, In progress, Review,</text>
    <text class="body small" x="1004" y="358">Done, and Approved.</text>
  </g>
  <g>
    <rect class="card amber" x="64" y="412" width="640" height="204" rx="22"/>
    <text class="label" x="88" y="450" font-size="14">CONTROL</text>
    <text class="node" x="88" y="488">Autonomous, or ask each time</text>
    <text class="body small" x="88" y="524">A supported tool action can wait</text>
    <text class="body small" x="88" y="552">for approval and a notification.</text>
    <text class="body small" x="88" y="580">Nudges are rate limited.</text>
  </g>
  <g>
    <rect class="card" x="736" y="412" width="600" height="204" rx="22"/>
    <text class="label" x="760" y="450" font-size="14">FILES</text>
    <text class="node" x="760" y="488">Checkout or a worktree</text>
    <text class="body small" x="760" y="524">Per teammate, at launch: the main</text>
    <text class="body small" x="760" y="552">checkout, or that agent's own</text>
    <text class="body small" x="760" y="580">git worktree. A PTY is built in.</text>
  </g>
  <g>
    <rect class="card" x="64" y="634" width="420" height="240" rx="22"/>
    <text class="label" x="88" y="672" font-size="14">RUNTIMES</text>
    <text class="node" x="88" y="710">Free model, or yours</text>
    <text class="body small" x="88" y="746">A no-auth model to start.</text>
    <text class="body small" x="88" y="774">Claude Code, Codex, OpenCode,</text>
    <text class="body small" x="88" y="802">Cursor, Copilot, and others</text>
    <text class="body small" x="88" y="830">you connect.</text>
  </g>
  <g>
    <rect class="card teal" x="516" y="634" width="400" height="240" rx="22"/>
    <text class="label" x="540" y="672" font-size="14">BUDGETS</text>
    <text class="node" x="540" y="710">Tokens and a cap</text>
    <text class="body small" x="540" y="746">Usage by team, agent, task,</text>
    <text class="body small" x="540" y="774">and model. Alerts at 80</text>
    <text class="body small" x="540" y="802">percent and 100 percent.</text>
  </g>
  <g>
    <rect class="card" x="948" y="634" width="388" height="240" rx="22"/>
    <text class="label" x="972" y="672" font-size="14">HTTP VIEW</text>
    <text class="node" x="972" y="710">Local or trusted net</text>
    <text class="body small" x="972" y="746">A limited dashboard.</text>
    <text class="body small" x="972" y="774">No built-in auth. Do not</text>
    <text class="body small" x="972" y="802">put it on the public</text>
    <text class="body small" x="972" y="830">internet as it ships.</text>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6e67"/>
    </marker>
  </defs>
</svg>
