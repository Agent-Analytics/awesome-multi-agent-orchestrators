<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">An agent, or a workflow graph</title>
  <desc id="desc">Mastra is a TypeScript framework. Studio at localhost:4111 is the local interface.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">MASTRA</text>
  <text class="serif" x="64" y="114" font-size="40">An agent, or a workflow graph</text>
  <text class="body" x="64" y="156" font-size="20">Agents loop on tools. Workflows use then, branch, and parallel. Storage can suspend either one.</text>
  <g>
    <rect class="card" x="64" y="200" width="300" height="250" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">1</text>
    <text class="node" x="88" y="282">Agent</text>
    <text class="body small" x="88" y="322">An LLM plus tools.</text>
    <text class="body small" x="88" y="350">It iterates until a</text>
    <text class="body small" x="88" y="378">final answer or a</text>
    <text class="body small" x="88" y="406">stopping condition.</text>
  </g>
  <g>
    <rect class="card teal" x="396" y="200" width="300" height="250" rx="22"/>
    <text class="label" x="420" y="240" font-size="14">2</text>
    <text class="node" x="420" y="282">Workflow</text>
    <text class="body small" x="420" y="322">.then(), .branch(), and</text>
    <text class="body small" x="420" y="350">.parallel() on a graph.</text>
    <text class="body small" x="420" y="378">Steps are explicit.</text>
    <text class="body small" x="420" y="406">You choose the order.</text>
  </g>
  <g>
    <rect class="card amber" x="728" y="200" width="300" height="250" rx="22"/>
    <text class="label" x="752" y="240" font-size="14">3</text>
    <text class="node" x="752" y="282">Suspend</text>
    <text class="body small" x="752" y="322">Storage keeps execution</text>
    <text class="body small" x="752" y="350">state. A person can</text>
    <text class="body small" x="752" y="378">approve, then the run</text>
    <text class="body small" x="752" y="406">resumes from that point.</text>
  </g>
  <g>
    <rect class="card" x="1060" y="200" width="276" height="250" rx="22"/>
    <text class="label" x="1084" y="240" font-size="14">4</text>
    <text class="node" x="1084" y="282">MCP</text>
    <text class="body small" x="1084" y="322">MCPClient calls external</text>
    <text class="body small" x="1084" y="350">servers. MCPServer</text>
    <text class="body small" x="1084" y="378">exposes agents, tools,</text>
    <text class="body small" x="1084" y="406">and workflows.</text>
  </g>
  <g>
    <rect class="card" x="64" y="520" width="1272" height="340" rx="22"/>
    <text class="label" x="88" y="560" font-size="14">LIMIT</text>
    <text class="node" x="88" y="602">What the license splits</text>
    <text class="body small" x="88" y="642">The core framework is Apache-2.0. Code under any ee/ directory is the Mastra Enterprise License.</text>
    <text class="body small" x="88" y="674">npm create mastra@latest scaffolds a project and can install skills for detected coding assistants.</text>
    <text class="body small" x="88" y="706">The README says Studio is where you build, test, and manage agents, workflows, and tools.</text>
  </g>
</svg>
