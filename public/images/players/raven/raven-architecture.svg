<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Raven host agent, DAG, and external tools</title>
  <desc id="desc">A diagram of Raven: the host agent plans a task, built-in and third-party agents run the pieces, and MCP servers supply tools.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .title { font-size: 40px; }
    .node { font-size: 24px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">RAVEN</text>
  <text class="serif title" x="64" y="112">One host agent, then a task graph</text>
  <text class="body" x="64" y="150" font-size="20">Built-in agents and third-party agents share one session. Editors can also launch Raven over ACP.</text>
    <rect class="card" x="64" y="190" width="300" height="140" rx="22"/>
    <text class="label" x="88" y="228" font-size="14">1</text>
    <text class="node" x="88" y="264">A task</text>
    <text class="body small" x="88" y="298">WebUI, TUI, or raven agent</text>
  <path d="M364 260 H420" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow)"/>
    <rect class="card teal" x="432" y="190" width="380" height="140" rx="22"/>
    <text class="label" x="456" y="228" font-size="14">2</text>
    <text class="node" x="456" y="264">Host agent</text>
    <text class="body small" x="456" y="298">Plans the work and dependencies</text>
  <path d="M812 260 H868" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow)"/>
    <rect class="card" x="880" y="190" width="456" height="140" rx="22"/>
    <text class="label" x="904" y="228" font-size="14">3</text>
    <text class="node" x="904" y="264">Agents run pieces</text>
    <text class="body small" x="904" y="298">Built-in, ACP, CLI, or API</text>
    <rect class="card teal" x="64" y="390" width="640" height="170" rx="22"/>
    <text class="label" x="88" y="428" font-size="14">BUILT IN</text>
    <text class="node" x="88" y="464">Research, Code, Design, Oncall</text>
    <text class="body small" x="88" y="498">Research reports, code, visuals,</text>
    <text class="body small" x="88" y="524">and unattended workflows.</text>
  <path d="M704 475 H760" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow)"/>
    <rect class="card" x="772" y="390" width="564" height="170" rx="22"/>
    <text class="label" x="796" y="428" font-size="14">THIRD PARTY</text>
    <text class="node" x="796" y="464">Presets, plus your own</text>
    <text class="body small" x="796" y="498">The README names 15 presets</text>
    <text class="body small" x="796" y="524">and nine Mirasim routes.</text>
    <rect class="card amber" x="64" y="620" width="420" height="210" rx="22"/>
    <text class="label" x="88" y="658" font-size="14">MCP</text>
    <text class="node" x="88" y="694">External tools</text>
    <text class="body small" x="88" y="728">tools.mcpServers, or PlugHub.</text>
    <text class="body small" x="88" y="754">OAuth via raven plugin auth.</text>
    <rect class="card" x="516" y="620" width="400" height="210" rx="22"/>
    <text class="label" x="540" y="658" font-size="14">MEMORY</text>
    <text class="node" x="540" y="694">EverOS</text>
    <text class="body small" x="540" y="728">User context, agent experience,</text>
    <text class="body small" x="540" y="754">and world knowledge.</text>
    <rect class="card" x="948" y="620" width="388" height="210" rx="22"/>
    <text class="label" x="972" y="658" font-size="14">CURATOR</text>
    <text class="node" x="972" y="694">Not in the wheel</text>
    <text class="body small" x="972" y="728">Ships with the repository.</text>
    <text class="body small" x="972" y="754">Installs a change only after a check.</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6e67"/>
    </marker>
  </defs>
</svg>
