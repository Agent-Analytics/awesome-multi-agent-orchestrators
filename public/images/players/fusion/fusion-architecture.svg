<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">A plan file, then a worktree</title>
  <desc id="desc">Fusion turns a plain-language task into PROMPT.md and runs it on branch fusion/task-id.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">FUSION</text>
  <text class="serif" x="64" y="114" font-size="40">A plan file, then a worktree</text>
  <text class="body" x="64" y="156" font-size="20">The board is the control surface. Merge and destructive actions still wait for a person.</text>
  <g>
    <rect class="card" x="64" y="200" width="300" height="250" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">1</text>
    <text class="node" x="88" y="282">Describe</text>
    <text class="body small" x="88" y="322">You write the task in</text>
    <text class="body small" x="88" y="350">the dashboard, on a</text>
    <text class="body small" x="88" y="378">phone, or with fn.</text>
    <text class="body small" x="88" y="406">Onboarding can be skipped.</text>
  </g>
  <g>
    <rect class="card teal" x="396" y="200" width="300" height="250" rx="22"/>
    <text class="label" x="420" y="240" font-size="14">2</text>
    <text class="node" x="420" y="282">PROMPT.md</text>
    <text class="body small" x="420" y="322">A planning agent writes</text>
    <text class="body small" x="420" y="350">steps, file scope, and</text>
    <text class="body small" x="420" y="378">acceptance criteria</text>
    <text class="body small" x="420" y="406">for that task.</text>
  </g>
  <g>
    <rect class="card amber" x="728" y="200" width="300" height="250" rx="22"/>
    <text class="label" x="752" y="240" font-size="14">3</text>
    <text class="node" x="752" y="282">Worktree</text>
    <text class="body small" x="752" y="322">The task runs on</text>
    <text class="body small" x="752" y="350">fusion/task-id. Parallel</text>
    <text class="body small" x="752" y="378">tasks do not share</text>
    <text class="body small" x="752" y="406">a checkout.</text>
  </g>
  <g>
    <rect class="card" x="1060" y="200" width="276" height="250" rx="22"/>
    <text class="label" x="1084" y="240" font-size="14">4</text>
    <text class="node" x="1084" y="282">Gates</text>
    <text class="body small" x="1084" y="322">Plan, review, execute,</text>
    <text class="body small" x="1084" y="350">and review. Oversight</text>
    <text class="body small" x="1084" y="378">can be off, observe,</text>
    <text class="body small" x="1084" y="406">steer, or autonomous.</text>
  </g>
  <g>
    <rect class="card" x="64" y="520" width="1272" height="340" rx="22"/>
    <text class="label" x="88" y="560" font-size="14">LIMIT</text>
    <text class="node" x="88" y="602">What still needs a person</text>
    <text class="body small" x="88" y="642">The README says merge, pull request, and destructive actions always require explicit human confirmation.</text>
    <text class="body small" x="88" y="674">MCP servers are stored in settings and forwarded only after an operator saves them.</text>
    <text class="body small" x="88" y="706">Local metadata uses embedded PostgreSQL. A shared external database is for multi-node setups.</text>
  </g>
</svg>
