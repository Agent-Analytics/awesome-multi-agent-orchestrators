<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Flowise Agentflow nodes and Custom MCP</title>
  <desc id="desc">A diagram of Flowise: an Agentflow runs from a Start node through an agent, and Custom MCP connects an external server.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .title { font-size: 40px; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">FLOWISE</text>
  <text class="serif title" x="64" y="112">Canvas on localhost:3000</text>
  <text class="body" x="64" y="150" font-size="20">npm install -g flowise, then npx flowise start. Node.js 20 or newer.</text>
  <g>
    <rect class="card" x="64" y="214" width="360" height="146" rx="22"/>
    <text class="label" x="88" y="250" font-size="14">1</text><text class="node" x="88" y="284">Start</text><text class="body small" x="88" y="318">The flow begins here.</text>
  </g>
  <g>
    <rect class="card teal" x="452" y="188" width="460" height="198" rx="22"/>
    <text class="label" x="476" y="224" font-size="14">2</text><text class="node" x="476" y="258">Agent or tool</text><text class="body small" x="476" y="292">The agent picks a tool.</text><text class="body small" x="476" y="318">A tool node runs the one</text><text class="body small" x="476" y="344">tool the canvas names.</text>
  </g>
  <g>
    <rect class="card" x="940" y="188" width="424" height="198" rx="22"/>
    <text class="label" x="964" y="224" font-size="14">3</text><text class="node" x="964" y="258">Branch or wait</text><text class="body small" x="964" y="292">Condition and loop nodes.</text><text class="body small" x="964" y="318">Human input stops</text><text class="body small" x="964" y="344">until a person replies.</text>
  </g>
  <path d="M428 287 H446" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-flowise)"/>
  <path d="M916 287 H934" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-flowise)"/>
  <g>
    <rect class="card amber" x="64" y="414" width="620" height="198" rx="22"/>
    <text class="label" x="88" y="450" font-size="14">MCP</text><text class="node" x="88" y="484">Custom MCP</text><text class="body small" x="88" y="518">stdio for a local process.</text><text class="body small" x="88" y="544">Streamable HTTP for a URL.</text><text class="body small" x="88" y="570">Refresh loads its actions.</text>
  </g>
  <g>
    <rect class="card" x="712" y="414" width="624" height="198" rx="22"/>
    <text class="label" x="736" y="450" font-size="14">STATE</text><text class="node" x="736" y="484">One flow state</text><text class="body small" x="736" y="518">Nodes read $flow.state.</text><text class="body small" x="736" y="544">Execute Flow calls</text><text class="body small" x="736" y="570">another saved flow.</text>
  </g>
  <path d="M688 513 H706" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-flowise)"/>
  <g>
    <rect class="card" x="64" y="640" width="1272" height="172" rx="22"/>
    <text class="label" x="88" y="676" font-size="14">ARCHIVE</text><text class="node" x="88" y="710">Repository archived</text><text class="body small" x="88" y="744">Discussion 6727, August 13, 2026: issues and pull requests lock.</text><text class="body small" x="88" y="770">The LICENSE.md file remains Apache 2.0. Source stays on GitHub.</text>
  </g>
  <defs>
    <marker id="arrow-flowise" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6e67"/>
    </marker>
  </defs>
</svg>
