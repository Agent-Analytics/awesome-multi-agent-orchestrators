<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Agent Framework executors and edges</title>
  <desc id="desc">Workflows are graphs of executors and edges. Agents can be nodes. Python and .NET are the in-repo SDKs.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">AGENT FRAMEWORK</text>
  <text class="serif" x="64" y="114" font-size="36">Executors, edges, then an agent node</text>
  <text class="body" x="64" y="156" font-size="20">pip install agent-framework. The .NET package is Microsoft.Agents.AI.</text>
  <g>
    <rect class="card" x="64" y="200" width="620" height="300" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">GRAPH</text>
    <text class="node" x="88" y="282">Executors and edges</text>
    <text class="body small" x="88" y="322">A workflow connects steps you write.</text>
    <text class="body small" x="88" y="350">Conditional edges route on a result.</text>
    <text class="body small" x="88" y="378">Fan-out can select several targets.</text>
  </g>
  <g>
    <rect class="card teal" x="716" y="200" width="620" height="300" rx="22"/>
    <text class="label" x="740" y="240" font-size="14">PATTERNS</text>
    <text class="node" x="740" y="282">Documented shapes</text>
    <text class="body small" x="740" y="322">Samples cover sequential, concurrent,</text>
    <text class="body small" x="740" y="350">handoff, and group chat.</text>
    <text class="body small" x="740" y="378">A workflow can be wrapped as an agent.</text>
  </g>
  <g>
    <rect class="card" x="64" y="530" width="620" height="300" rx="22"/>
    <text class="label" x="88" y="570" font-size="14">STREAM</text>
    <text class="node" x="88" y="612">Events while it runs</text>
    <text class="body small" x="88" y="652">run(stream=True) yields events.</text>
    <text class="body small" x="88" y="680">OpenTelemetry hooks are in the samples.</text>
    <text class="body small" x="88" y="708">DevUI is a local developer UI.</text>
  </g>
  <g>
    <rect class="card amber" x="716" y="530" width="620" height="300" rx="22"/>
    <text class="label" x="740" y="570" font-size="14">YOU WRITE IT</text>
    <text class="node" x="740" y="612">Not a workspace app</text>
    <text class="body small" x="740" y="652">You build and test the application.</text>
    <text class="body small" x="740" y="680">Provider credentials stay yours.</text>
    <text class="body small" x="740" y="708">The Go SDK is a separate repository.</text>
  </g>
</svg>
