<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Agent Framework checkpoints and MCP client</title>
  <desc id="desc">Checkpoints can resume a paused workflow. MCPStreamableHTTPTool connects an agent to an MCP server URL.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">AGENT FRAMEWORK</text>
  <text class="serif" x="64" y="114" font-size="36">Checkpoint the run, or call an MCP server</text>
  <text class="body" x="64" y="156" font-size="20">The MCP sample keeps a caller-owned client open for the whole sequential run.</text>
  <g>
    <rect class="card" x="64" y="200" width="620" height="300" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">CHECKPOINT</text>
    <text class="node" x="88" y="282">Stop and resume</text>
    <text class="body small" x="88" y="322">Samples save checkpoints and resume.</text>
    <text class="body small" x="88" y="350">Cosmos DB storage is one backend.</text>
    <text class="body small" x="88" y="378">In-memory storage is another.</text>
  </g>
  <g>
    <rect class="card teal" x="716" y="200" width="620" height="300" rx="22"/>
    <text class="label" x="740" y="240" font-size="14">HITL</text>
    <text class="node" x="740" y="282">request_info</text>
    <text class="body small" x="740" y="322">A step can pause for a person.</text>
    <text class="body small" x="740" y="350">Tool approval can wait in the workflow</text>
    <text class="body small" x="740" y="378">or use middleware on the agent.</text>
  </g>
  <g>
    <rect class="card amber" x="64" y="530" width="620" height="300" rx="22"/>
    <text class="label" x="88" y="570" font-size="14">MCP</text>
    <text class="node" x="88" y="612">External server</text>
    <text class="body small" x="88" y="652">MCPStreamableHTTPTool takes a URL.</text>
    <text class="body small" x="88" y="680">The sample calls Microsoft Learn MCP.</text>
    <text class="body small" x="88" y="708">The caller can own the client lifetime.</text>
  </g>
  <g>
    <rect class="card" x="716" y="530" width="620" height="300" rx="22"/>
    <text class="label" x="740" y="570" font-size="14">HOST</text>
    <text class="node" x="740" y="612">Foundry is optional</text>
    <text class="body small" x="740" y="652">Foundry hosted agents are two extra</text>
    <text class="body small" x="740" y="680">calls in the hosting samples.</text>
    <text class="body small" x="740" y="708">Local runs do not require that host.</text>
  </g>
</svg>
