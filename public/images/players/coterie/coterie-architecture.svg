<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Coterie host: portal, chorusd, and persMEM</title>
  <desc id="desc">Each Claude Code agent is a Unix user. chorusd types into terminals. persMEM is the MCP memory server that answers every boot.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">COTERIE</text>
  <text class="serif" x="64" y="114" font-size="36">One Debian host. One Unix user per agent.</text>
  <text class="body" x="64" y="156" font-size="20">The browser is a window onto tmux. Closing it leaves the agents running.</text>
  <g>
    <rect class="card" x="64" y="200" width="400" height="240" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">PORTAL</text>
    <text class="node" x="88" y="282">Caddy and ttyd</text>
    <text class="body small" x="88" y="322">HTTPS, a password, an IP</text>
    <text class="body small" x="88" y="350">allowlist. Each agent has</text>
    <text class="body small" x="88" y="378">its own terminal. Debian 13,</text>
    <text class="body small" x="88" y="406">or an LXC container.</text>
  </g>
  <g>
    <rect class="card teal" x="500" y="200" width="400" height="240" rx="22"/>
    <text class="label" x="524" y="240" font-size="14">CHORUSD</text>
    <text class="node" x="524" y="282">Types, does not decide</text>
    <text class="body small" x="524" y="322">Delivers boots. Rings the</text>
    <text class="body small" x="524" y="350">terminal when mail arrives</text>
    <text class="body small" x="524" y="378">and the agent is idle.</text>
    <text class="body small" x="524" y="406">A chorus round shares one prompt.</text>
  </g>
  <g>
    <rect class="card amber" x="936" y="200" width="400" height="240" rx="22"/>
    <text class="label" x="960" y="240" font-size="14">PERSMEM</text>
    <text class="node" x="960" y="282">MCP memory server</text>
    <text class="body small" x="960" y="322">Identity, rules, state, mail,</text>
    <text class="body small" x="960" y="350">handoffs. The boot manifest</text>
    <text class="body small" x="960" y="378">hashes what was sent.</text>
    <text class="body small" x="960" y="406">Every agent connects to it.</text>
  </g>
  <g>
    <rect class="card" x="64" y="470" width="620" height="350" rx="22"/>
    <text class="label" x="88" y="510" font-size="14">REVIEW</text>
    <text class="node" x="88" y="552">A different model</text>
    <text class="body small" x="88" y="592">A second reader counts as independent</text>
    <text class="body small" x="88" y="620">only on a different model. Two agents</text>
    <text class="body small" x="88" y="648">on the same model count as one vote.</text>
    <text class="body small" x="88" y="676">The boot prompt checks the model against</text>
    <text class="body small" x="88" y="704">the identity, and waits if they differ.</text>
  </g>
  <g>
    <rect class="card" x="720" y="470" width="616" height="350" rx="22"/>
    <text class="label" x="744" y="510" font-size="14">INSTALL</text>
    <text class="node" x="744" y="552">One line, then logins</text>
    <text class="body small" x="744" y="592">Root on Debian 13. A Claude Code login</text>
    <text class="body small" x="744" y="620">per agent. Setup writes a dispatch block</text>
    <text class="body small" x="744" y="648">into each CLAUDE.md. Boot prompts get a</text>
    <text class="body small" x="744" y="676">private git server unless you bring one.</text>
    <text class="body small" x="744" y="704">Apache-2.0.</text>
  </g>
</svg>
