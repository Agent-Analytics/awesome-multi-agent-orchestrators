<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Agno agents running on AgentOS</title>
  <desc id="desc">A diagram of Agno: agents, teams, and workflows run on AgentOS, and callers use REST, MCP, or a chat interface.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .title { font-size: 40px; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">AGNO</text>
  <text class="serif title" x="64" y="112">A platform you run yourself</text>
  <text class="body" x="64" y="150" font-size="20">The license is Apache 2.0. Postgres stores sessions, memory, and activity.</text>
  <g>
    <rect class="card" x="64" y="188" width="420" height="198" rx="22"/>
    <text class="label" x="88" y="224" font-size="14">BUILD</text><text class="node" x="88" y="258">Agents and workflows</text><text class="body small" x="88" y="292">Teams can delegate.</text><text class="body small" x="88" y="318">Workflows route, loop,</text><text class="body small" x="88" y="344">branch, and run in parallel.</text>
  </g>
  <g>
    <rect class="card teal" x="512" y="188" width="430" height="198" rx="22"/>
    <text class="label" x="536" y="224" font-size="14">AGENTOS</text><text class="node" x="536" y="258">The service</text><text class="body small" x="536" y="292">REST API and MCP server.</text><text class="body small" x="536" y="318">Auth and roles.</text><text class="body small" x="536" y="344">Schedules and durable jobs.</text>
  </g>
  <g>
    <rect class="card" x="970" y="188" width="394" height="198" rx="22"/>
    <text class="label" x="994" y="224" font-size="14">CALLERS</text><text class="node" x="994" y="258">Three doors</text><text class="body small" x="994" y="292">Your product uses REST.</text><text class="body small" x="994" y="318">Claude and ChatGPT use MCP.</text><text class="body small" x="994" y="344">Slack uses Interfaces.</text>
  </g>
  <path d="M488 287 H506" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-agno-platform)"/>
  <path d="M946 287 H964" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-agno-platform)"/>
  <g>
    <rect class="card amber" x="64" y="414" width="620" height="198" rx="22"/>
    <text class="label" x="88" y="450" font-size="14">APPROVAL</text><text class="node" x="88" y="484">Stop for a person</text><text class="body small" x="88" y="518">A sensitive action waits.</text><text class="body small" x="88" y="544">Approve, then the run</text><text class="body small" x="88" y="570">continues.</text>
  </g>
  <g>
    <rect class="card" x="712" y="414" width="624" height="198" rx="22"/>
    <text class="label" x="736" y="450" font-size="14">COMPANY OS</text><text class="node" x="736" y="484">Projects and routines</text><text class="body small" x="736" y="518">People set direction.</text><text class="body small" x="736" y="544">Agents carry the tasks.</text><text class="body small" x="736" y="570">A routine can propose changes.</text>
  </g>
  <path d="M688 513 H706" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-agno-platform)"/>
  <g>
    <rect class="card" x="64" y="640" width="1272" height="172" rx="22"/>
    <text class="label" x="88" y="676" font-size="14">SETUP</text><text class="node" x="88" y="710">Clone a template</text><text class="body small" x="88" y="744">Docker, Railway, AWS, GCP, Azure, Fly, Render, Modal, or Helm.</text><text class="body small" x="88" y="770">The setup skill runs the platform locally. The UI is os.agno.com.</text>
  </g>
  <defs>
    <marker id="arrow-agno-platform" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6e67"/>
    </marker>
  </defs>
</svg>
