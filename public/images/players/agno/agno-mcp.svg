<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Agno MCPTools connected to an external MCP server</title>
  <desc id="desc">A diagram of Agno MCPTools: stdio or streamable HTTP connects an agent to an MCP server, and the connection is closed after the run.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .title { font-size: 40px; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">AGNO MCP</text>
  <text class="serif title" x="64" y="112">One MCPTools object per server</text>
  <text class="body" x="64" y="150" font-size="20">The docs install path is uv pip install with the mcp extra.</text>
  <g>
    <rect class="card" x="64" y="188" width="430" height="198" rx="22"/>
    <text class="label" x="88" y="224" font-size="14">SERVER</text><text class="node" x="88" y="258">Command or URL</text><text class="body small" x="88" y="292">stdio runs a local command.</text><text class="body small" x="88" y="318">A URL uses streamable HTTP.</text><text class="body small" x="88" y="344">SSE is deprecated in v3.0.4.</text>
  </g>
  <g>
    <rect class="card teal" x="522" y="188" width="420" height="198" rx="22"/>
    <text class="label" x="546" y="224" font-size="14">MCPTOOLS</text><text class="node" x="546" y="258">Connect, then close</text><text class="body small" x="546" y="292">include_tools picks names.</text><text class="body small" x="546" y="318">refresh_connection checks</text><text class="body small" x="546" y="344">the session before a run.</text>
  </g>
  <g>
    <rect class="card" x="970" y="188" width="394" height="198" rx="22"/>
    <text class="label" x="994" y="224" font-size="14">AGENT</text><text class="node" x="994" y="258">tools list</text><text class="body small" x="994" y="292">Pass MCPTools in.</text><text class="body small" x="994" y="318">The agent calls those</text><text class="body small" x="994" y="344">tools during the run.</text>
  </g>
  <path d="M498 287 H516" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-agno-mcp)"/>
  <path d="M946 287 H964" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-agno-mcp)"/>
  <g>
    <rect class="card" x="64" y="414" width="620" height="198" rx="22"/>
    <text class="label" x="88" y="450" font-size="14">AGENTOS</text><text class="node" x="88" y="484">Managed for you</text><text class="body small" x="88" y="518">You skip connect and close.</text><text class="body small" x="88" y="544">Set refresh_connection</text><text class="body small" x="88" y="570">if the server restarts.</text>
  </g>
  <g>
    <rect class="card amber" x="712" y="414" width="624" height="198" rx="22"/>
    <text class="label" x="736" y="450" font-size="14">TELEMETRY</text><text class="node" x="736" y="484">One event per agent</text><text class="body small" x="736" y="518">The README says prompts</text><text class="body small" x="736" y="544">and outputs are not sent.</text><text class="body small" x="736" y="570">AGNO_TELEMETRY=false turns it off.</text>
  </g>
  <path d="M688 513 H706" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-agno-mcp)"/>
  <g>
    <rect class="card" x="64" y="640" width="1272" height="172" rx="22"/>
    <text class="label" x="88" y="676" font-size="14">JOBS</text><text class="node" x="88" y="710">Durable execution</text><text class="body small" x="88" y="744">Background jobs keep status across a restart.</text><text class="body small" x="88" y="770">Claude and Codex can run in sandboxes when that path is configured.</text>
  </g>
  <defs>
    <marker id="arrow-agno-mcp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6e67"/>
    </marker>
  </defs>
</svg>
