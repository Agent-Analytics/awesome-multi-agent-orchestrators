<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">One run() call</title>
  <desc id="desc">Sandcastle runs a coding agent inside a sandbox and brings the commits back.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">SANDCASTLE</text>
  <text class="serif" x="64" y="114" font-size="40">One run() call</text>
  <text class="body" x="64" y="156" font-size="20">You pick the agent and the sandbox. Sandcastle starts the iteration and collects commits.</text>
  <g>
    <rect class="card" x="64" y="200" width="400" height="250" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">1</text>
    <text class="node" x="88" y="282">Agent</text>
    <text class="body small" x="88" y="322">claudeCode, codex, pi,</text>
    <text class="body small" x="88" y="350">copilot, cursor, or</text>
    <text class="body small" x="88" y="378">opencode. You pass the</text>
    <text class="body small" x="88" y="406">model string.</text>
  </g>
  <g>
    <rect class="card teal" x="500" y="200" width="400" height="250" rx="22"/>
    <text class="label" x="524" y="240" font-size="14">2</text>
    <text class="node" x="524" y="282">Sandbox</text>
    <text class="body small" x="524" y="322">bwrap, seatbelt, Docker,</text>
    <text class="body small" x="524" y="350">Podman, Daytona, E2B,</text>
    <text class="body small" x="524" y="378">Sprites, Modal, Vercel,</text>
    <text class="body small" x="524" y="406">or a provider you write.</text>
  </g>
  <g>
    <rect class="card amber" x="936" y="200" width="400" height="250" rx="22"/>
    <text class="label" x="960" y="240" font-size="14">3</text>
    <text class="node" x="960" y="282">Iteration</text>
    <text class="body small" x="960" y="322">One pass is one start</text>
    <text class="body small" x="960" y="350">and exit. maxIterations</text>
    <text class="body small" x="960" y="378">raises the loop. Commits</text>
    <text class="body small" x="960" y="406">come back as sha values.</text>
  </g>
  <g>
    <rect class="card" x="64" y="520" width="1272" height="340" rx="22"/>
    <text class="label" x="88" y="560" font-size="14">LIMIT</text>
    <text class="node" x="88" y="602">What init prepares</text>
    <text class="body small" x="88" y="642">npx @ai-hero/sandcastle init scaffolds .sandcastle and checks the native sandbox on this machine.</text>
    <text class="body small" x="88" y="674">A native sandbox hides the host's stored logins. The agent uses CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY.</text>
    <text class="body small" x="88" y="706">AFK runs default to skipping the agent's own permission prompts unless you set permissionMode.</text>
  </g>
</svg>
