<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Where the commits land</title>
  <desc id="desc">Sandcastle has three branch strategies. Bind-mount and isolated providers default differently.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">SANDCASTLE</text>
  <text class="serif" x="64" y="114" font-size="40">Where the commits land</text>
  <text class="body" x="64" y="156" font-size="20">The branch strategy is an argument to run(), not a setting on the provider.</text>
  <g>
    <rect class="card" x="64" y="200" width="400" height="250" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">1</text>
    <text class="node" x="88" y="282">head</text>
    <text class="body small" x="88" y="322">The agent writes the</text>
    <text class="body small" x="88" y="350">host checkout directly.</text>
    <text class="body small" x="88" y="378">Default for bind-mount</text>
    <text class="body small" x="88" y="406">providers such as Docker.</text>
  </g>
  <g>
    <rect class="card teal" x="500" y="200" width="400" height="250" rx="22"/>
    <text class="label" x="524" y="240" font-size="14">2</text>
    <text class="node" x="524" y="282">merge-to-head</text>
    <text class="body small" x="524" y="322">A temp branch in a</text>
    <text class="body small" x="524" y="350">worktree. Sandcastle</text>
    <text class="body small" x="524" y="378">merges it back. A failed</text>
    <text class="body small" x="524" y="406">merge leaves HEAD as it was.</text>
  </g>
  <g>
    <rect class="card amber" x="936" y="200" width="400" height="250" rx="22"/>
    <text class="label" x="960" y="240" font-size="14">3</text>
    <text class="node" x="960" y="282">branch</text>
    <text class="body small" x="960" y="322">Commits land on the</text>
    <text class="body small" x="960" y="350">branch you name, in</text>
    <text class="body small" x="960" y="378">a worktree. The same</text>
    <text class="body small" x="960" y="406">name reuses that worktree.</text>
  </g>
  <g>
    <rect class="card" x="64" y="520" width="1272" height="340" rx="22"/>
    <text class="label" x="88" y="560" font-size="14">LIMIT</text>
    <text class="node" x="88" y="602">What the sandbox does not decide</text>
    <text class="body small" x="88" y="642">Git config, hooks, and program-running repo config are mounted read-only or ignored by Sandcastle's own git.</text>
    <text class="body small" x="88" y="674">Git commands you run later, such as git status, are outside that protection. Review the diff first.</text>
    <text class="body small" x="88" y="706">The README and guides do not document an MCP client. The license is MIT.</text>
  </g>
</svg>
