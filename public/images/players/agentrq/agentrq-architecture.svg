<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">AgentRQ workspace MCP, permission, and history</title>
  <desc id="desc">An agent pulls tasks with that workspace's token. A tool call can wait for you, and the call stays in the history.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .title { font-size: 40px; }
    .node { font-size: 24px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 17px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">AGENTRQ</text>
  <text class="serif title" x="64" y="112">One MCP URL per workspace</text>
  <text class="body" x="64" y="152" font-size="20">An agent pulls tasks with that workspace's token. A tool call can wait for you, and the call stays in the history.</text>
  <g>
    <rect class="card" x="64" y="190" width="405" height="250" rx="22"/>
    <text class="label" x="88" y="230" font-size="14">1</text>
    <text class="node" x="88" y="268">Workspace</text>
    <text class="body small" x="88" y="308">Its own MCP URL, token,</text>
    <text class="body small" x="88" y="336">queue, memory, and folder.</text>
  </g>
  <path d="M473 315 H491" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-agentrq-workspace-mcp-permission-and-history)"/>
  <g>
    <rect class="card amber" x="497" y="190" width="405" height="250" rx="22"/>
    <text class="label" x="521" y="230" font-size="14">2</text>
    <text class="node" x="521" y="268">Ask or YOLO</text>
    <text class="body small" x="521" y="308">A call can wait. YOLO</text>
    <text class="body small" x="521" y="336">auto-allows later calls</text>
    <text class="body small" x="521" y="364">and still records them.</text>
  </g>
  <path d="M907 315 H925" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-agentrq-workspace-mcp-permission-and-history)"/>
  <g>
    <rect class="card teal" x="931" y="190" width="405" height="250" rx="22"/>
    <text class="label" x="955" y="230" font-size="14">3</text>
    <text class="node" x="955" y="268">History</text>
    <text class="body small" x="955" y="308">Trajectory lanes: Input,</text>
    <text class="body small" x="955" y="336">Agent, and Tools.</text>
  </g>
  <g>
    <rect class="card" x="64" y="490" width="405" height="330" rx="22"/>
    <text class="label" x="88" y="530" font-size="14">MACHINE</text>
    <text class="node" x="88" y="568">agentrqd</text>
    <text class="body small" x="88" y="608">A single-use code enrolls</text>
    <text class="body small" x="88" y="636">a computer. The browser</text>
    <text class="body small" x="88" y="664">gets a live terminal.</text>
  </g>
  <g>
    <rect class="card" x="497" y="490" width="405" height="330" rx="22"/>
    <text class="label" x="521" y="530" font-size="14">SKILLS</text>
    <text class="node" x="521" y="568">SKILL.md</text>
    <text class="body small" x="521" y="608">Import from a public</text>
    <text class="body small" x="521" y="636">GitHub link. Agents load</text>
    <text class="body small" x="521" y="664">the skill over MCP.</text>
  </g>
  <g>
    <rect class="card teal" x="931" y="490" width="405" height="330" rx="22"/>
    <text class="label" x="955" y="530" font-size="14">LICENSE</text>
    <text class="node" x="955" y="568">AGPL-3.0</text>
    <text class="body small" x="955" y="608">This repository only.</text>
    <text class="body small" x="955" y="636">The daemon, desktop,</text>
    <text class="body small" x="955" y="664">websocket, and plugins</text>
    <text class="body small" x="955" y="692">are Apache-2.0.</text>
  </g>
  <defs>
    <marker id="arrow-agentrq-workspace-mcp-permission-and-history" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6e67"/>
    </marker>
  </defs>
</svg>
