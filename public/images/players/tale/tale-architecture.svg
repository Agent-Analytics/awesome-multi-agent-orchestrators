<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Tale assignment does not start the agent</title>
  <desc id="desc">A project agent runs in a sandbox after someone starts the task. A child agent cannot start further agents.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">TALE</text>
  <text class="serif" x="64" y="114" font-size="36">Assign the task, then start the agent</text>
  <text class="body" x="64" y="156" font-size="20">Reports land in the task. Collected files land as deliverables.</text>
  <g>
    <rect class="card" x="64" y="200" width="620" height="300" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">BOARD</text>
    <text class="node" x="88" y="282">Assignment waits</text>
    <text class="body small" x="88" y="322">Assigning an agent leaves the task</text>
    <text class="body small" x="88" y="350">in Backlog until someone starts it.</text>
    <text class="body small" x="88" y="378">Create and start does both at once.</text>
  </g>
  <g>
    <rect class="card teal" x="716" y="200" width="620" height="300" rx="22"/>
    <text class="label" x="740" y="240" font-size="14">SANDBOX</text>
    <text class="node" x="740" y="282">Named project agent</text>
    <text class="body small" x="740" y="322">The agent has a harness, a model,</text>
    <text class="body small" x="740" y="350">and the tools it was given.</text>
    <text class="body small" x="740" y="378">The run uses the task and its files.</text>
  </g>
  <g>
    <rect class="card" x="64" y="530" width="620" height="300" rx="22"/>
    <text class="label" x="88" y="570" font-size="14">REVIEW</text>
    <text class="node" x="88" y="612">Comments and files</text>
    <text class="body small" x="88" y="652">The report is a task comment.</text>
    <text class="body small" x="88" y="680">You can ask for changes in the task.</text>
    <text class="body small" x="88" y="708">A blocked task does not start.</text>
  </g>
  <g>
    <rect class="card amber" x="716" y="530" width="620" height="300" rx="22"/>
    <text class="label" x="740" y="570" font-size="14">LIMIT</text>
    <text class="node" x="740" y="612">One level of start</text>
    <text class="body small" x="740" y="652">A manager can start other agents</text>
    <text class="body small" x="740" y="680">when it has the delegation tools.</text>
    <text class="body small" x="740" y="708">An agent it started cannot start more.</text>
  </g>
</svg>
