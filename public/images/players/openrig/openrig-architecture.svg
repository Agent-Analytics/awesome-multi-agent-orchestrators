<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenRig RigSpec, tmux seats, and MCP</title>
  <desc id="desc">A YAML RigSpec names pods, edges, and continuity. rig up starts tmux sessions. Hosted members join through the MCP server.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">OPENRIG</text>
  <text class="serif" x="64" y="114" font-size="36">A YAML team, then tmux seats</text>
  <text class="body" x="64" y="156" font-size="20">Apache-2.0. Node.js 22 or 24, tmux, macOS or Linux. Native Windows is not supported.</text>
  <g>
    <rect class="card" x="64" y="200" width="620" height="300" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">SPEC</text>
    <text class="node" x="88" y="282">Pods and edges</text>
    <text class="body small" x="88" y="322">starter is a builder and a reviewer.</text>
    <text class="body small" x="88" y="350">factory is seven seats for longer work.</text>
    <text class="body small" x="88" y="378">rig specs preview prints the spec.</text>
  </g>
  <g>
    <rect class="card teal" x="716" y="200" width="620" height="300" rx="22"/>
    <text class="label" x="740" y="240" font-size="14">UP</text>
    <text class="node" x="740" y="282">Daemon and tmux</text>
    <text class="body small" x="740" y="322">rig up starts harnesses and checks.</text>
    <text class="body small" x="740" y="350">You can attach to a terminal seat.</text>
    <text class="body small" x="740" y="378">rig down --snapshot stores the topology.</text>
  </g>
  <g>
    <rect class="card" x="64" y="530" width="620" height="300" rx="22"/>
    <text class="label" x="88" y="570" font-size="14">TALK</text>
    <text class="node" x="88" y="612">Send and chatrooms</text>
    <text class="body small" x="88" y="652">rig send, broadcast, and chatroom</text>
    <text class="body small" x="88" y="680">move messages through the daemon.</text>
    <text class="body small" x="88" y="708">A typing guard holds automatic input.</text>
  </g>
  <g>
    <rect class="card amber" x="716" y="530" width="620" height="300" rx="22"/>
    <text class="label" x="740" y="570" font-size="14">MCP</text>
    <text class="node" x="740" y="612">Tools and hosted seats</text>
    <text class="body small" x="740" y="652">Agents can call rig_up and rig_send.</text>
    <text class="body small" x="740" y="680">Hosted members have no tmux pane.</text>
    <text class="body small" x="740" y="708">Setup can add Exa and Context7 entries.</text>
  </g>
</svg>
