<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">A storyline, then a handoff</title>
  <desc id="desc">NarraNexus agents keep identity and storylines, and they message each other on MessageBus.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">NARRANEXUS</text>
  <text class="serif" x="64" y="114" font-size="40">A storyline, then a handoff</text>
  <text class="body" x="64" y="156" font-size="20">Each agent keeps its own memory scope. Sharing goes through a governed channel.</text>
  <g>
    <rect class="card" x="64" y="200" width="300" height="250" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">1</text>
    <text class="node" x="88" y="282">Identity</text>
    <text class="body small" x="88" y="322">Awareness holds role,</text>
    <text class="body small" x="88" y="350">preferences, and</text>
    <text class="body small" x="88" y="378">boundaries across</text>
    <text class="body small" x="88" y="406">sessions.</text>
  </g>
  <g>
    <rect class="card teal" x="396" y="200" width="300" height="250" rx="22"/>
    <text class="label" x="420" y="240" font-size="14">2</text>
    <text class="node" x="420" y="282">Narrative</text>
    <text class="body small" x="420" y="322">Events sit on a</text>
    <text class="body small" x="420" y="350">storyline. An overturned</text>
    <text class="body small" x="420" y="378">conclusion is marked</text>
    <text class="body small" x="420" y="406">invalid, not deleted.</text>
  </g>
  <g>
    <rect class="card amber" x="728" y="200" width="300" height="250" rx="22"/>
    <text class="label" x="752" y="240" font-size="14">3</text>
    <text class="node" x="752" y="282">Scope</text>
    <text class="body small" x="752" y="322">Memory is agent, user,</text>
    <text class="body small" x="752" y="350">storyline, team, or</text>
    <text class="body small" x="752" y="378">global. Private notes</text>
    <text class="body small" x="752" y="406">do not leak by default.</text>
  </g>
  <g>
    <rect class="card" x="1060" y="200" width="276" height="250" rx="22"/>
    <text class="label" x="1084" y="240" font-size="14">4</text>
    <text class="node" x="1084" y="282">MessageBus</text>
    <text class="body small" x="1084" y="322">Agents @mention, open</text>
    <text class="body small" x="1084" y="350">rooms, and hand work</text>
    <text class="body small" x="1084" y="378">off. Each agent has</text>
    <text class="body small" x="1084" y="406">its own skills and MCP.</text>
  </g>
  <g>
    <rect class="card" x="64" y="520" width="1272" height="340" rx="22"/>
    <text class="label" x="88" y="560" font-size="14">LIMIT</text>
    <text class="node" x="88" y="602">How you run it</text>
    <text class="body small" x="88" y="642">Cloud sign-up, a macOS dmg with its own runtime, or bash run.sh from a clone.</text>
    <text class="body small" x="88" y="674">The published control panel shows frontend :5173, backend :8000, a DB proxy, and an MCP server.</text>
    <text class="body small" x="88" y="706">Local and desktop runs use your own LLM API key. The license is Apache-2.0.</text>
  </g>
</svg>
