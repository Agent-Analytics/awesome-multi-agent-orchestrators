<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">The control plane is separate</title>
  <desc id="desc">Proliferate self-hosting runs Caddy, Postgres, and the API. The desktop app is configured to use that plane.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">PROLIFERATE</text>
  <text class="serif" x="64" y="114" font-size="40">The control plane is separate</text>
  <text class="body" x="64" y="156" font-size="20">The desktop app points at a control plane you can run yourself.</text>
  <g>
    <rect class="card" x="64" y="200" width="400" height="250" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">1</text>
    <text class="node" x="88" y="282">Compose</text>
    <text class="body small" x="88" y="322">Docker Compose runs</text>
    <text class="body small" x="88" y="350">Caddy, Postgres, and</text>
    <text class="body small" x="88" y="378">the API, with bootstrap</text>
    <text class="body small" x="88" y="406">and update scripts.</text>
  </g>
  <g>
    <rect class="card teal" x="500" y="200" width="400" height="250" rx="22"/>
    <text class="label" x="524" y="240" font-size="14">2</text>
    <text class="node" x="524" y="282">Cloud</text>
    <text class="body small" x="524" y="322">The README also links</text>
    <text class="body small" x="524" y="350">AWS CloudFormation,</text>
    <text class="body small" x="524" y="378">GCP, Azure, Kubernetes,</text>
    <text class="body small" x="524" y="406">and air-gapped operation.</text>
  </g>
  <g>
    <rect class="card amber" x="936" y="200" width="400" height="250" rx="22"/>
    <text class="label" x="960" y="240" font-size="14">3</text>
    <text class="node" x="960" y="282">Desktop</text>
    <text class="body small" x="960" y="322">Point the macOS app at</text>
    <text class="body small" x="960" y="350">that plane. Local dev</text>
    <text class="body small" x="960" y="378">uses Rust, Node 22, and</text>
    <text class="body small" x="960" y="406">pnpm, plus Docker.</text>
  </g>
  <g>
    <rect class="card" x="64" y="520" width="1272" height="340" rx="22"/>
    <text class="label" x="88" y="560" font-size="14">LIMIT</text>
    <text class="node" x="88" y="602">What a local full stack adds</text>
    <text class="body small" x="88" y="642">Full local development also needs Python 3.12 or newer, uv, and Docker for the database.</text>
    <text class="body small" x="88" y="674">Named dev profiles keep more than one worktree from sharing ports and app labels.</text>
    <text class="body small" x="88" y="706">The license file in the repository is AGPL-3.0.</text>
  </g>
</svg>
