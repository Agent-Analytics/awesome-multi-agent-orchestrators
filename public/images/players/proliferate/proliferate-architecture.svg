<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">One workspace, one worktree per task</title>
  <desc id="desc">A Proliferate workspace runs coding agents in parallel. Each task has an isolated git worktree.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">PROLIFERATE</text>
  <text class="serif" x="64" y="114" font-size="40">One workspace, one worktree per task</text>
  <text class="body" x="64" y="156" font-size="20">Each agent keeps its own harness. The task keeps its own branch.</text>
  <g>
    <rect class="card" x="64" y="200" width="400" height="250" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">1</text>
    <text class="node" x="88" y="282">Task</text>
    <text class="body small" x="88" y="322">A thread in the workspace.</text>
    <text class="body small" x="88" y="350">Its branch, terminal,</text>
    <text class="body small" x="88" y="378">conversation, and review</text>
    <text class="body small" x="88" y="406">state stay with that task.</text>
  </g>
  <g>
    <rect class="card teal" x="500" y="200" width="400" height="250" rx="22"/>
    <text class="label" x="524" y="240" font-size="14">2</text>
    <text class="node" x="524" y="282">Worktree</text>
    <text class="body small" x="524" y="322">The README gives every</text>
    <text class="body small" x="524" y="350">task an isolated git</text>
    <text class="body small" x="524" y="378">worktree, so parallel</text>
    <text class="body small" x="524" y="406">tasks do not share a checkout.</text>
  </g>
  <g>
    <rect class="card amber" x="936" y="200" width="400" height="250" rx="22"/>
    <text class="label" x="960" y="240" font-size="14">3</text>
    <text class="node" x="960" y="282">Subagent</text>
    <text class="body small" x="960" y="322">A parent agent can hand</text>
    <text class="body small" x="960" y="350">scoped work to a child.</text>
    <text class="body small" x="960" y="378">The child returns the</text>
    <text class="body small" x="960" y="406">result when it finishes.</text>
  </g>
  <g>
    <rect class="card" x="64" y="520" width="1272" height="340" rx="22"/>
    <text class="label" x="88" y="560" font-size="14">LIMIT</text>
    <text class="node" x="88" y="602">Shared once, then used by every agent</text>
    <text class="body small" x="88" y="642">MCPs, skills, Computer Use, Browser Use, and custom tools are configured once.</text>
    <text class="body small" x="88" y="674">Workflows cover recurring and event-driven runs, such as a nightly review or triage on an alert.</text>
    <text class="body small" x="88" y="706">The control plane can run as Caddy, Postgres, and the API, including an air-gapped deploy.</text>
  </g>
</svg>
