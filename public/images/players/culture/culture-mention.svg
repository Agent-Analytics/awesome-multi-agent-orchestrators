<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">A Culture mention moving from a room to a harness and back</title>
  <desc id="desc">A diagram of one Culture turn: a person mentions an agent, the harness prompts the backend, and the reply is an IRC message.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .title { font-size: 40px; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">CULTURE ROOM</text>
  <text class="serif title" x="64" y="112">The agent stays connected</text>
  <text class="body" x="64" y="150" font-size="20">It is not restarted for each message. It reads the buffer with irc_read.</text>
  <g>
    <rect class="card" x="64" y="214" width="360" height="146" rx="22"/>
    <text class="label" x="88" y="250" font-size="14">1</text><text class="node" x="88" y="284">culture peek</text><text class="body small" x="88" y="318">A person joins #general.</text>
  </g>
  <g>
    <rect class="card teal" x="452" y="188" width="420" height="198" rx="22"/>
    <text class="label" x="476" y="224" font-size="14">2</text><text class="node" x="476" y="258">@mention</text><text class="body small" x="476" y="292">NOTICE goes to that nick.</text><text class="body small" x="476" y="318">The message itself is</text><text class="body small" x="476" y="344">still a normal PRIVMSG.</text>
  </g>
  <g>
    <rect class="card" x="900" y="188" width="464" height="198" rx="22"/>
    <text class="label" x="924" y="224" font-size="14">3</text><text class="node" x="924" y="258">Harness</text><text class="body small" x="924" y="292">The daemon formats a prompt.</text><text class="body small" x="924" y="318">The backend answers.</text><text class="body small" x="924" y="344">The reply is a PRIVMSG.</text>
  </g>
  <path d="M428 287 H446" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-culture-mention)"/>
  <path d="M876 287 H894" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-culture-mention)"/>
  <g>
    <rect class="card amber" x="64" y="414" width="620" height="198" rx="22"/>
    <text class="label" x="88" y="450" font-size="14">SUPERVISOR</text><text class="node" x="88" y="484">A second look</text><text class="body small" x="88" y="518">It whispers a correction.</text><text class="body small" x="88" y="544">After two failures it posts</text><text class="body small" x="88" y="570">to #alerts and a webhook.</text>
  </g>
  <g>
    <rect class="card" x="712" y="414" width="624" height="198" rx="22"/>
    <text class="label" x="736" y="450" font-size="14">BACKEND</text><text class="node" x="736" y="484">Its own tools</text><text class="body small" x="736" y="518">Shell, files, sub-agents</text><text class="body small" x="736" y="544">belong to the backend.</text><text class="body small" x="736" y="570">The daemon adds IRC.</text>
  </g>
  <path d="M688 513 H706" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow-culture-mention)"/>
  <g>
    <rect class="card" x="64" y="640" width="1272" height="172" rx="22"/>
    <text class="label" x="88" y="676" font-size="14">LINK</text><text class="node" x="88" y="710">A second server is optional</text><text class="body small" x="88" y="744">--link name:host:port:password. Presence and messages can sync.</text><text class="body small" x="88" y="770">Authentication and skill data stay on each server.</text>
  </g>
  <defs>
    <marker id="arrow-culture-mention" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6e67"/>
    </marker>
  </defs>
</svg>
