<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">AX task lifecycle from apply to suspend</title>
  <desc id="desc">New tasks start Suspended. Resume starts the actor after the workspace is ready. Suspend checkpoints and pauses.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="900" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">GOOGLE AX</text>
  <text class="serif" x="64" y="114" font-size="36">New tasks start suspended.</text>
  <text class="body" x="64" y="156" font-size="20">Resume schedules the actor. Suspend checkpoints it and pauses.</text>
  <g>
    <rect class="card" x="64" y="200" width="300" height="250" rx="22"/>
    <text class="label" x="88" y="240" font-size="14">1</text>
    <text class="node" x="88" y="282">Apply</text>
    <text class="body small" x="88" y="322">ax apply -f task.yaml</text>
    <text class="body small" x="88" y="350">creates the record.</text>
    <text class="body small" x="88" y="378">The spec cannot be</text>
    <text class="body small" x="88" y="406">edited in place.</text>
  </g>
  <g>
    <rect class="card teal" x="388" y="200" width="300" height="250" rx="22"/>
    <text class="label" x="412" y="240" font-size="14">2</text>
    <text class="node" x="412" y="282">Resume</text>
    <text class="body small" x="412" y="322">ax resume task name</text>
    <text class="body small" x="412" y="350">waits for the workspace.</text>
    <text class="body small" x="412" y="378">No free worker: the task</text>
    <text class="body small" x="412" y="406">stays Suspended.</text>
  </g>
  <g>
    <rect class="card" x="712" y="200" width="300" height="250" rx="22"/>
    <text class="label" x="736" y="240" font-size="14">3</text>
    <text class="node" x="736" y="282">Run</text>
    <text class="body small" x="736" y="322">Ready is true when the</text>
    <text class="body small" x="736" y="350">task is running and the</text>
    <text class="body small" x="736" y="378">workspace is ready.</text>
    <text class="body small" x="736" y="406">Default cap: 1 CPU, 512Mi.</text>
  </g>
  <g>
    <rect class="card amber" x="1036" y="200" width="300" height="250" rx="22"/>
    <text class="label" x="1060" y="240" font-size="14">4</text>
    <text class="node" x="1060" y="282">Suspend</text>
    <text class="body small" x="1060" y="322">ax suspend checkpoints</text>
    <text class="body small" x="1060" y="350">actor state and pauses.</text>
    <text class="body small" x="1060" y="378">Resume continues that</text>
    <text class="body small" x="1060" y="406">checkpoint.</text>
  </g>
  <g>
    <rect class="card" x="64" y="490" width="1272" height="320" rx="22"/>
    <text class="label" x="88" y="530" font-size="14">RELEASE</text>
    <text class="node" x="88" y="572">v0.3.1, and the README's warning</text>
    <text class="body small" x="88" y="612">The latest GitHub release is v0.3.1, published September 25, 2026.</text>
    <text class="body small" x="88" y="640">The README says AX is in heavy development and will likely introduce</text>
    <text class="body small" x="88" y="668">breaking changes before a stable release. The license is Apache-2.0.</text>
    <text class="body small" x="88" y="696">Install the CLI with go install github.com/google/ax/cmd/ax@latest,</text>
    <text class="body small" x="88" y="724">then make images and make deploy against a cluster running Agent Substrate.</text>
  </g>
</svg>
