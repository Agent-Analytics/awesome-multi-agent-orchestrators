<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 974" role="img" aria-labelledby="title desc">
  <title id="title">Vibe Kanban issue, workspace worktree, review, and MCP settings</title>
  <desc id="desc">A diagram of Vibe Kanban: an issue becomes a git worktree workspace, the agent runs there, and MCP server JSON is saved into the agent's own config.</desc>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; fill: #1d1712; }
    .body { font-family: Outfit, "Segoe UI", sans-serif; fill: #5e554d; }
    .label { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.08em; fill: #1a6e67; }
    .title { font-size: 40px; }
    .node { font-size: 26px; font-weight: 700; fill: #1d1712; }
    .small { font-size: 18px; }
    .card { fill: #fffaf2; stroke: #1d1712; stroke-opacity: 0.18; }
    .teal { fill: #e7f3f1; stroke: #1a6e67; }
    .amber { fill: #fbf1e4; stroke: #c56a2d; }
  </style>
  <rect width="1400" height="974" fill="#f8f2e7"/>
  <text class="label" x="64" y="64" font-size="16">VIBE KANBAN</text>
  <text class="serif title" x="64" y="112">An issue, then a worktree</text>
  <text class="body" x="64" y="150" font-size="20">Apache-2.0. npx vibe-kanban. The local server defaults to 127.0.0.1.</text>
  <g>
    <rect class="card" x="64" y="190" width="300" height="176" rx="22"/>
    <text class="label" x="88" y="228" font-size="14">1</text>
    <text class="node" x="88" y="266">Kanban issue</text>
    <text class="body small" x="88" y="302">Plan it on the board,</text>
    <text class="body small" x="88" y="330">then open a workspace.</text>
  </g>
  <path d="M364 260 H410" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow)"/>
  <g>
    <rect class="card teal" x="422" y="190" width="480" height="204" rx="22"/>
    <text class="label" x="446" y="228" font-size="14">2</text>
    <text class="node" x="446" y="266">Git worktree</text>
    <text class="body small" x="446" y="302">Folder .vibe-kanban-workspaces.</text>
    <text class="body small" x="446" y="330">Branch name starts with vk/.</text>
    <text class="body small" x="446" y="358">Your checkout stays as it was.</text>
  </g>
  <path d="M902 260 H948" fill="none" stroke="#1a6e67" stroke-width="3" marker-end="url(#arrow)"/>
  <g>
    <rect class="card" x="960" y="190" width="376" height="204" rx="22"/>
    <text class="label" x="984" y="228" font-size="14">3</text>
    <text class="node" x="984" y="266">Agent session</text>
    <text class="body small" x="984" y="302">Claude Code, Codex, and</text>
    <text class="body small" x="984" y="330">the other CLIs in the docs.</text>
    <text class="body small" x="984" y="358">It can run commands.</text>
  </g>
  <g>
    <rect class="card" x="64" y="412" width="640" height="204" rx="22"/>
    <text class="label" x="88" y="450" font-size="14">REVIEW</text>
    <text class="node" x="88" y="488">Diff, browser, pull request</text>
    <text class="body small" x="88" y="524">Inline comments go to the agent.</text>
    <text class="body small" x="88" y="552">A dev server script can start</text>
    <text class="body small" x="88" y="580">from the workspace. Then a PR.</text>
  </g>
  <g>
    <rect class="card amber" x="736" y="412" width="600" height="232" rx="22"/>
    <text class="label" x="760" y="450" font-size="14">MCP</text>
    <text class="node" x="760" y="488">Per agent, in its own file</text>
    <text class="body small" x="760" y="524">Settings, MCP Servers, JSON.</text>
    <text class="body small" x="760" y="552">The docs say this writes the</text>
    <text class="body small" x="760" y="580">agent's global config, and it</text>
    <text class="body small" x="760" y="608">stays after you leave the app.</text>
  </g>
  <g>
    <rect class="card teal" x="64" y="662" width="640" height="288" rx="22"/>
    <text class="label" x="88" y="700" font-size="14">APRIL 10, 2026</text>
    <text class="node" x="88" y="738">Company shutdown note</text>
    <text class="body small" x="88" y="774">Louis Knight-Webb said bloop was</text>
    <text class="body small" x="88" y="802">shutting down and the repo would</text>
    <text class="body small" x="88" y="830">stay open source. Remote services</text>
    <text class="body small" x="88" y="858">were to remain 30 days. The docs</text>
    <text class="body small" x="88" y="886">site on November 13, 2026 still</text>
    <text class="body small" x="88" y="914">documents Cloud and Docker Compose.</text>
  </g>
  <g>
    <rect class="card" x="736" y="662" width="600" height="240" rx="22"/>
    <text class="label" x="760" y="700" font-size="14">ALSO DOCUMENTED</text>
    <text class="node" x="760" y="738">Vibe Kanban as a server</text>
    <text class="body small" x="760" y="774">A separate docs page is for</text>
    <text class="body small" x="760" y="802">external MCP clients that call</text>
    <text class="body small" x="760" y="830">Vibe Kanban's own MCP server.</text>
    <text class="body small" x="760" y="858">Self-host steps use Compose.</text>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6e67"/>
    </marker>
  </defs>
</svg>
